<head>
<meta charset="utf-8">

<title>Feuilles de temps</title>
<style>
:root {
  --fond: #f4f1ea;
  --carte: #ffffff;
  --encre: #1f2a24;
  --encre-2: #5b625d;
  --ligne: #e3ddd1;
  --accent: #c2410c;
  --accent-fonce: #9a3412;
  --accent-pale: #fff1e8;
  --vert: #15803d;
  --vert-pale: #e8f5ec;
  --jaune: #a16207;
  --jaune-pale: #fdf6dd;
  --rouge: #b91c1c;
  --rouge-pale: #fdecec;
  --rayon: 12px;
  --ombre: 0 1px 2px rgba(31,42,36,.06), 0 2px 8px rgba(31,42,36,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); color: var(--encre); }
body {
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
body.sans-nav { padding-bottom: 24px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.2; }

/* ---------- En-tête ---------- */
.entete {
  position: sticky; top: 0; z-index: 10;
  background: var(--encre); color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 12px;
}
.entete .titre { font-weight: 700; font-size: 17px; flex: 1; letter-spacing: .01em; }
.entete .qui { font-size: 13px; opacity: .8; }
.entete button { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }

.main { max-width: 760px; margin: 0 auto; padding: 16px; }

/* ---------- Navigation du bas ---------- */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  background: var(--carte); border-top: 1px solid var(--ligne);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav button {
  flex: 1; max-width: 150px; background: none; border: 0; cursor: pointer;
  padding: 9px 4px 10px; font-size: 12px; color: var(--encre-2);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav button svg { width: 22px; height: 22px; }
.nav button.actif { color: var(--accent); font-weight: 600; }
.nav .pastille { background: var(--accent); color: #fff; border-radius: 99px; font-size: 10px; padding: 0 5px; margin-left: 2px; }

/* ---------- Éléments communs ---------- */
.carte { background: var(--carte); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 14px; margin-bottom: 12px; }
.ligne-flex { display: flex; align-items: center; gap: 8px; }
.espace { flex: 1; }
.muet { color: var(--encre-2); font-size: 14px; }
.petit { font-size: 13px; }
.gras { font-weight: 600; }
.centre { text-align: center; }
.droite { text-align: right; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--ligne); background: var(--carte); color: var(--encre);
  border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 15px;
  cursor: pointer; min-height: 44px; text-decoration: none;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn.primaire { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primaire:hover:not(:disabled) { background: var(--accent-fonce); }
.btn.vert { background: var(--vert); border-color: var(--vert); color: #fff; }
.btn.danger { color: var(--rouge); border-color: #f0c9c9; }
.btn.petit { min-height: 34px; padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.lien { border: 0; background: none; color: var(--accent); padding: 6px; min-height: 0; }
.btn.plein { width: 100%; }
.btn.icone { width: 40px; min-height: 40px; padding: 0; }

.champ { display: block; margin-bottom: 14px; }
.champ > span { display: block; font-size: 13px; font-weight: 600; color: var(--encre-2); margin-bottom: 5px; }
.champ input:not([type=checkbox]), .champ select, .champ textarea {
  width: 100%; border: 1px solid var(--ligne); border-radius: 10px; background: #fff;
  padding: 11px 12px; min-height: 46px; font-size: 16px;
}
.champ textarea { min-height: 70px; resize: vertical; }
.champ input:focus, .champ select:focus, .champ textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.case { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; cursor: pointer; }
.case input { width: 20px; height: 20px; accent-color: var(--accent); }
.rangee { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.rangee .champ input { min-width: 0; }

.badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.badge.soumis { background: var(--jaune-pale); color: var(--jaune); }
.badge.approuve { background: var(--vert-pale); color: var(--vert); }
.badge.refuse { background: var(--rouge-pale); color: var(--rouge); }
.badge.neutre { background: #eee9df; color: var(--encre-2); }
.badge.admin { background: var(--accent-pale); color: var(--accent-fonce); }
.badge.qbo { background: #e6eef7; color: #1e4e8c; }

.alerte { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
.alerte.jaune { background: var(--jaune-pale); color: #6b4505; }
.alerte.rouge { background: var(--rouge-pale); color: #7f1d1d; }
.alerte.info { background: #eef2f0; color: var(--encre); }

/* ---------- Semaine ---------- */
.nav-semaine { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.nav-semaine .etiquette { flex: 1; text-align: center; font-weight: 700; }
.nav-semaine .etiquette small { display: block; font-weight: 400; color: var(--encre-2); font-size: 12px; }

.total-semaine { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 12px; padding: 14px; }
.total-semaine .chiffre { font-size: 30px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }

.jour { padding: 0; overflow: hidden; }
.jour .tete { display: flex; align-items: center; padding: 11px 14px; gap: 8px; }
.jour .tete .nom { font-weight: 700; }
.jour.aujourdhui { outline: 2px solid var(--accent); }
.jour.fin-semaine .tete { background: #faf8f3; }
.entree {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border-top: 1px solid var(--ligne); cursor: pointer; background: none; width: 100%; text-align: left; border-left: 0; border-right: 0; border-bottom: 0;
}
.entree:hover { background: #fbfaf7; }
.entree .infos { flex: 1; min-width: 0; }
.entree .chantier { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entree .note { font-size: 13px; color: var(--encre-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entree .note.code { color: var(--encre); font-size: 13px; font-variant-numeric: tabular-nums; }
.entree .motif { font-size: 13px; color: var(--rouge); }
.entree .heures { font-weight: 700; font-variant-numeric: tabular-nums; }
.ajouter { border-top: 1px dashed var(--ligne); }
.ajouter button { width: 100%; background: none; border: 0; color: var(--accent); font-weight: 600; padding: 11px; cursor: pointer; font-size: 15px; }

/* ---------- Tableaux ---------- */
.table-wrap { overflow-x: auto; margin: 0 -14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--ligne); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--encre-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 700; border-bottom: 0; }
tr.sous td { color: var(--encre-2); font-size: 13px; padding-top: 5px; padding-bottom: 5px; }
tr.sous td:first-child { padding-left: 30px; }

.onglets { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
.onglets button { border: 1px solid var(--ligne); background: var(--carte); border-radius: 99px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.onglets button.actif { background: var(--encre); color: #fff; border-color: var(--encre); }
.puces { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.puces button { border: 1px solid var(--ligne); background: #fff; border-radius: 99px; padding: 5px 11px; font-size: 13px; cursor: pointer; }

.liste-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--ligne); cursor: pointer; }
.liste-item:first-child { border-top: 0; }
.liste-item:hover { background: #fbfaf7; }
.liste-item.inactif { opacity: .55; }

.employe-tete { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.employe-tete h3 { font-size: 17px; }

/* ---------- Modale ---------- */
.modal-fond {
  position: fixed; inset: 0; z-index: 50; background: rgba(20,24,22,.45);
  display: flex; align-items: flex-end; justify-content: center;
  animation: apparait .15s ease-out;
}
.modal {
  background: var(--carte); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
  border-radius: 18px 18px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
  animation: monte .2s ease-out;
}
.modal h2 { font-size: 20px; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; }
@media (min-width: 600px) {
  .modal-fond { align-items: center; }
  .modal { border-radius: 18px; }
}
@keyframes apparait { from { opacity: 0; } }
@keyframes monte { from { transform: translateY(30px); opacity: .5; } }

.segment { display: flex; border: 1px solid var(--ligne); border-radius: 10px; overflow: hidden; }
.segment button { flex: 1; border: 0; background: #fff; padding: 11px 6px; min-height: 46px; font-weight: 600; cursor: pointer; color: var(--encre-2); }
.segment button + button { border-left: 1px solid var(--ligne); }
.segment button.actif { background: var(--encre); color: #fff; }
.segment button:disabled { cursor: default; opacity: .7; }
.lignes-code { display: flex; flex-direction: column; gap: 10px; }
.ligne-code { display: flex; flex-direction: column; gap: 6px; }
.ligne-code.cadre { border: 1px solid var(--ligne); border-radius: 12px; padding: 10px; background: #fcfbf8; }
.ligne-code select, .ligne-code input { width: 100%; border: 1px solid var(--ligne); border-radius: 10px; background: #fff; padding: 11px 12px; min-height: 46px; font-size: 16px; }
.ligne-code select:focus, .ligne-code input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.ligne-code .aide-code:empty { display: none; }
.ligne-code .lc-bas { display: flex; gap: 8px; align-items: stretch; }
.ligne-code .lc-bas input { flex: 0 0 96px; width: 96px; }
.ligne-code .petit-seg { flex: 1; min-width: 0; }
.ligne-code .petit-seg button { padding: 8px 4px; font-size: 14px; }
.ligne-code .retirer { flex: 0 0 46px; min-height: 46px; font-size: 22px; color: var(--rouge); }
.ajout-ligne { align-self: flex-start; padding-left: 0; }
.total-lignes { font-size: 14px; color: var(--encre-2); text-align: right; }
.entree .note.code { display: flex; gap: 8px; }
.entree .ligne-carte + .ligne-carte { margin-top: 4px; }
.ligne-code textarea { width: 100%; border: 1px solid var(--ligne); border-radius: 10px; background: #fff; padding: 10px 12px; min-height: 64px; font-size: 16px; resize: vertical; }
.ligne-code textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.entree .note.code .lib { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entree .note.code .h-ligne { font-variant-numeric: tabular-nums; color: var(--encre-2); white-space: nowrap; }
.entree .note.code .nf { color: var(--encre-2); white-space: nowrap; font-style: italic; }
.ajouter-jour { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 0 10px 8px; }
.ajouter-jour > button { flex: 1 1 100%; }
.absences-btns { display: flex; gap: 6px; flex: 1 1 100%; justify-content: center; }
.absences-btns button { border: 1px solid var(--ligne); background: #fff; color: var(--encre-2); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 32px; }
.absences-btns button.actif { color: #fff; border-color: transparent; }
.absences-btns .abs-maladie.actif, .badge.abs-maladie { background: #7c3aed; color: #fff; }
.absences-btns .abs-conge.actif, .badge.abs-conge { background: #0e7490; color: #fff; }
.absences-btns .abs-ferie.actif, .badge.abs-ferie { background: #4d5a52; color: #fff; }
.badge.abs { border: 0; cursor: default; }
button.badge.abs { cursor: pointer; }
.absences-ligne { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.rapport-doc { padding: 18px 16px; }
.rapport-tete { border-bottom: 2px solid var(--encre); padding-bottom: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 3px; }
.rapport-tete h2 { font-size: 22px; text-wrap: balance; }
.rapport-periode { font-weight: 700; margin-top: 6px; }
.rapport-chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 6px; }
.rapport-chiffres > div { background: var(--fond); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.rapport-chiffres span { font-size: 12px; color: var(--encre-2); text-transform: uppercase; letter-spacing: .04em; }
.rapport-chiffres b { font-size: 20px; font-variant-numeric: tabular-nums; }
.journal td { vertical-align: top; }
.journal .date-j { white-space: nowrap; font-weight: 700; }
.journal .code-j { min-width: 150px; }
.journal .desc-j { min-width: 180px; }
.journal tr.debut-jour td { border-top: 1px solid var(--encre-2); }
.journal tr.sous-total-j td { color: var(--encre-2); font-size: 13px; padding-top: 4px; }
.tag-nf { color: var(--encre-2); font-style: italic; font-size: 13px; }
@media print {
  .entete, .nav, .no-print, .toast, .demo-barre, .modal-fond { display: none !important; }
  html, body { background: #fff; }
  body { padding: 0; }
  .main { max-width: none; padding: 0; }
  .carte { box-shadow: none; }
  .rapport-doc { padding: 0; }
  .table-wrap { overflow: visible; margin: 0; }
  table { font-size: 11px; }
  tr { break-inside: avoid; }
  .rapport-chiffres > div { border: 1px solid #ccc; background: #fff; }
}
.raccourcis { display: flex; gap: 6px; margin-top: 8px; }

/* ---------- Calendrier du mois ---------- */
.cal-filtres { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.cal-filtres select { flex: 1; min-width: 0; border: 1px solid var(--ligne); border-radius: 10px; background: #fff; padding: 9px 10px; min-height: 42px; font-size: 15px; }
.cal { padding: 8px; }
.cal-grille { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-tete { font-size: 11px; font-weight: 700; color: var(--encre-2); text-align: center; padding: 4px 0; text-transform: uppercase; letter-spacing: .03em; }
.cal-jour { border: 1px solid var(--ligne); border-radius: 8px; background: #fff; min-height: 58px; padding: 4px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; cursor: pointer; text-align: left; font: inherit; color: inherit; min-width: 0; }
.cal-jour.hors { visibility: hidden; }
.cal-jour.fds { background: #faf8f3; }
.cal-jour.auj { outline: 2px solid var(--accent); outline-offset: -1px; }

.cal-jour.choisi .cal-h { color: #fff; }

.cal-legende .lg { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.cal-legende .lg .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.cal-detail .ligne-lecture { padding: 10px 14px; border-top: 1px solid var(--ligne); display: flex; gap: 10px; align-items: flex-start; }
@media (min-width: 600px) { .cal-jour { min-height: 78px; padding: 6px; } .cal-h { font-size: 15px; } .cal-pt { width: 10px; height: 10px; } }
.raccourcis button { flex: 1; border: 1px solid var(--ligne); background: #faf8f3; border-radius: 8px; padding: 8px 0; font-weight: 600; cursor: pointer; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--encre); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 100;
  font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px);
  animation: apparait .15s ease-out;

/* ---------- Connexion ---------- */
.connexion { max-width: 380px; margin: 0 auto; padding: 60px 20px 20px; }
.connexion .logo { width: 56px; height: 56px; margin-bottom: 16px; }
.connexion h1 { font-size: 26px; margin-bottom: 6px; }
.connexion p { margin: 0 0 24px; }

.chargement { text-align: center; color: var(--encre-2); padding: 40px 0; }
.vide { text-align: center; color: var(--encre-2); padding: 24px 10px; font-size: 14px; }
.section-titre { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--encre-2); font-weight: 700; margin: 20px 0 8px; }
</style>

<script>
"use strict";

/* =====================================================================
   CONFIGURATION — dans le fichier config.js (partagé avec l'app punch)
   ===================================================================== */
const CONFIG = window.CONFIG || { SUPABASE_URL: "https://VOTRE-PROJET.supabase.co", SUPABASE_ANON_KEY: "VOTRE-CLE-ANON-PUBLIQUE" };

/* Colonnes du fichier d'import Employeur D.
   À ajuster selon le « Canevas d'importation – Transaction de paie »
   (Employeur D > Paie > Outils > Importer les transactions > aide).
   Chaque colonne : titre affiché + fonction qui donne la valeur. */
const COLONNES_EMPLOYEUR_D = [
  { titre: "No compagnie",  valeur: (l) => l.noCompagnie },
  { titre: "Matricule",     valeur: (l) => l.matricule },
  { titre: "Période",       valeur: (l) => l.periode },      // dernière journée de la période de paie
  { titre: "Code de gain",  valeur: (l) => l.codeGain },
  { titre: "Heures",        valeur: (l) => l.heures },
];

/* =====================================================================
   Utilitaires
   ===================================================================== */
const $ = (sel) => document.querySelector(sel);

// Construit un élément DOM. Le texte passe toujours par des nœuds texte :
// aucune apostrophe ou caractère spécial ne peut briser le code.
function h(tag, props, ...enfants) {
  const el = document.createElement(tag);
  const proprietes = {};
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k === "value" || k === "checked" || k === "disabled" || k === "selected") proprietes[k] = v;
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  for (const e of enfants.flat(Infinity)) {
    if (e === null || e === undefined || e === false) continue;
    el.append(e instanceof Node ? e : String(e));
  }
  for (const [k, v] of Object.entries(proprietes)) el[k] = v;
  return el;
}

function icone(nom) {
  const chemins = {
    horloge: "M12 7v5l3 2M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z",

/* ---------- Dates (toujours en heure locale, jamais en UTC) ---------- */
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function versDate(s) { const [a, m, j] = s.split("-").map(Number); return new Date(a, m - 1, j); }
function ajouterJours(d, n) { const r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate() + n); return r; }
function lundiDe(d) { const r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate() - ((r.getDay() + 6) % 7)); return r; }
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const JOURS_COURTS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juill.", "août", "sept.", "oct.", "nov.", "déc."];
const dateLongue = (d) => `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`;
const dateCourte = (d) => `${JOURS_COURTS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`;
function etiquetteSemaine(lundi) {
  const dim = ajouterJours(lundi, 6);
  const debut = lundi.getMonth() === dim.getMonth() ? `${lundi.getDate()}` : `${lundi.getDate()} ${MOIS[lundi.getMonth()]}`;
  return `${debut} au ${dim.getDate()} ${MOIS[dim.getMonth()]} ${dim.getFullYear()}`;
}
function plages() {
  const auj = new Date();
  const lundi = lundiDe(auj);
  const debutMois = new Date(auj.getFullYear(), auj.getMonth(), 1);
  return {
    "Cette semaine": [lundi, ajouterJours(lundi, 6)],
    "Semaine passée": [ajouterJours(lundi, -7), ajouterJours(lundi, -1)],
    "2 dernières semaines": [ajouterJours(lundi, -14), ajouterJours(lundi, -1)],
    "Ce mois-ci": [debutMois, new Date(auj.getFullYear(), auj.getMonth() + 1, 0)],
    "Mois passé": [new Date(auj.getFullYear(), auj.getMonth() - 1, 1), ajouterJours(debutMois, -1)],
  };
}

/* ---------- Nombres ---------- */
const arrondi2 = (n) => Math.round(n * 100) / 100;
const fmtH = (n) => `${Number(n || 0).toLocaleString("fr-CA", { maximumFractionDigits: 2 })} h`;
const fmtNb = (n) => Number(n || 0).toLocaleString("fr-CA", { maximumFractionDigits: 2 });
const fmtArgent = (n) => Number(n || 0).toLocaleString("fr-CA", { style: "currency", currency: "CAD" });
const somme = (liste, f) => arrondi2(liste.reduce((s, x) => s + Number(f(x) || 0), 0));
function lireNombre(txt) {
  if (txt === null || txt === undefined) return NaN;
  const s = String(txt).trim().replace(/\s/g, "").replace(",", ".");
  if (s === "") return NaN;
  // accepte aussi le format heures:minutes (ex. 7:30)
  const hm = s.match(/^(\d{1,2}):(\d{2})$/);
  if (hm) return Number(hm[1]) + Number(hm[2]) / 60;
  return Number(s);
}

/* ---------- Messages ---------- */
function toast(message, type) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = h("div", { class: "toast" + (type === "erreur" ? " erreur" : ""), role: "status" }, message);
  document.body.append(t);
  setTimeout(() => t.remove(), type === "erreur" ? 5000 : 2500);
}
function messageErreur(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "Courriel ou mot de passe invalide.";
  if (/Email not confirmed/i.test(m)) return "Ce compte n’est pas encore confirmé.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Pas de connexion Internet. Réessaie dans un instant.";
  if (/row-level security|permission denied/i.test(m)) return "Tu n’as pas la permission de faire ça.";
  if (/Password should be/i.test(m)) return "Le mot de passe doit contenir au moins 6 caractères.";
  if (/Database error saving new user|pas autorisé/i.test(m)) return "Ce courriel n’est pas autorisé. Demande au bureau de t’ajouter dans l’app avec ce courriel.";
  if (/already registered|already been registered/i.test(m)) return "Ce courriel a déjà un compte. Connecte-toi, ou utilise « Mot de passe oublié ? ».";
  if (/Signups not allowed/i.test(m)) return "La création de compte est désactivée dans Supabase (Authentication > Sign In / Providers > Allow new users to sign up).";
  if (/profils_courriel|duplicate key/i.test(m)) return "Ce courriel est déjà utilisé par un autre employé.";
  return m;
}
function erreur(e) { console.error(e); toast(messageErreur(e), "erreur"); }

// Désactive le bouton pendant l'opération (évite les doubles clics)

function ouvrirModal(construire) {
  let fond;
  const fermer = () => { if (fond) fond.remove(); document.removeEventListener("keydown", surTouche); };
  const surTouche = (e) => { if (e.key === "Escape") fermer(); };
  const { titre, contenu, actions } = construire(fermer);
  fond = h("div", { class: "modal-fond", onclick: (e) => { if (e.target === fond) fermer(); } },
    h("div", { class: "modal", role: "dialog", "aria-modal": "true" },
      h("h2", null, titre), contenu, h("div", { class: "modal-actions" }, actions)));
  document.body.append(fond);
  document.addEventListener("keydown", surTouche);
  const premier = fond.querySelector("input:not([type=checkbox]), select, textarea");
  if (premier && window.matchMedia("(min-width: 600px)").matches) premier.focus();
  return fermer;
}

function telecharger(nom, contenu, type) {
  const blob = contenu instanceof Blob ? contenu : new Blob([contenu], { type });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: nom });
  document.body.append(a);

function versCSV(lignes) {
  const cellule = (v) => {
    if (v === null || v === undefined) return "";
    const s = typeof v === "number" ? String(v).replace(".", ",") : String(v);
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return "﻿" + lignes.map((l) => l.map(cellule).join(";")).join("\r\n");
}

async function q(promesse) {

// Récupère toutes les lignes (Supabase limite à 1000 par requête)
async function toutes(construireRequete) {
  const resultats = [];
  for (let de = 0; ; de += 1000) {
    const page = await q(construireRequete().range(de, de + 999));
    resultats.push(...page);
    if (page.length < 1000) return resultats;
  }
}

const qboConnecte = () => Boolean(S.qboStatut && S.qboStatut.connecte);
async function appelQbo(action, extra) {
  let data, error;
  try { ({ data, error } = await sb.functions.invoke("quickbooks", { body: { action, ...(extra || {}) } })); }
  catch (e) { error = e; }
  if (error) {
    let msg = error.message || String(error);
    try { const j = await error.context.json(); if (j && j.erreur) msg = j.erreur; } catch (_) { /* pas de détail */ }
    if (/Failed to send|Failed to fetch|Load failed|NetworkError|404/i.test(msg)) msg = "La fonction QuickBooks ne répond pas. Vérifie qu’elle est installée dans Supabase (Edge Functions › quickbooks).";
    throw new Error(msg);
  }
  if (data && data.ok === false && data.erreur) throw new Error(data.erreur);
  return data;
}

  if (!S.session || !S.moi) { document.body.classList.add("sans-nav"); app.replaceChildren(S.creerCompte ? vueCreerCompte() : vueConnexion()); return; }

  const nav = estLecteur() ? navigation() : null;
  document.body.classList.toggle("sans-nav", !nav);
  app.replaceChildren(entete(), main, nav || "");
  try {
    const vue = VUES[S.vue] || VUES.heures;

/* ---------- Regroupement des lignes d'une même entrée ---------- */
// Chaque ligne (code de coût + heures) est une rangée dans la base ; les rangées
// d'une même entrée partagent le même « groupe ». L'app les affiche, les approuve
// et les verrouille ensemble.
function grouper(rangees) {
  const parGroupe = new Map();
  for (const r of rangees) {
    const cle = r.groupe || `id-${r.id}`;
    if (!parGroupe.has(cle)) parGroupe.set(cle, []);
    parGroupe.get(cle).push(r);
  }
  const rang = { refuse: 0, soumis: 1, approuve: 2 };
  const ordreCode = (code) => { const c = codeInfo(code); return c ? c.ordre : 9999; };
  return [...parGroupe.values()].map((lignes) => {
    const p = lignes[0];
    lignes.sort((a, b) => ordreCode(a.code_cout) - ordreCode(b.code_cout));
    const verrou = lignes.find((l) => l.exporte_qbo_le);
    const refus = lignes.find((l) => l.motif_refus);
    return {
      groupe: p.groupe || null, employe_id: p.employe_id, date: p.date, chantier_id: p.chantier_id,
      statut: lignes.map((l) => l.statut).sort((a, b) => rang[a] - rang[b])[0],
      motif_refus: refus ? refus.motif_refus : null,
      exporte_qbo_le: verrou ? verrou.exporte_qbo_le : null,
      lignes, ids: lignes.map((l) => l.id), heures: somme(lignes, (l) => l.heures),
    };
  });
}
const idsDe = (groupes) => groupes.flatMap((g) => g.ids);

/* =====================================================================
   Formulaire d'entrée de temps (une entrée = une ou plusieurs lignes)
   ===================================================================== */
function formEntree({ entree, date, employeId }) {
  const admin = estAdmin();
  const nouveau = !entree;
  // verrouillée = déjà transférée dans QuickBooks (pour tout le monde, admin compris)
  const verrouille = estVerrouillee(entree);

  // Nouvelle entrée : on reprend le chantier et le code de la dernière entrée de l'employé
  const precedent = nouveau && S.derniere ? S.derniere : null;
  const chantierDepart = entree ? entree.chantier_id
    : precedent && S.chantiers.some((c) => c.id === precedent.chantier_id && c.actif) ? precedent.chantier_id : "";
  const codeDepart = precedent && S.codes.some((c) => c.code === precedent.code_cout && c.actif) ? precedent.code_cout : "";

  const choixChantiers = S.chantiers.filter((c) => c.actif || (entree && c.id === entree.chantier_id));
  const selChantier = h("select", { required: true, disabled: verrouille, value: chantierDepart ? String(chantierDepart) : "" },
    h("option", { value: "" }, "— Choisir un chantier / projet —"),
    choixChantiers.map((c) => h("option", { value: String(c.id) }, c.client ? `${c.nom} (${c.client})` : c.nom)));
  const champDate = h("input", { type: "date", required: true, disabled: verrouille, value: entree ? entree.date : ymd(date || new Date()) });
  const chantierChoisi = () => S.chantiers.find((x) => String(x.id) === selChantier.value);
  const factParDefaut = () => { const c = chantierChoisi(); return c ? c.facturable : true; };

  // Lignes : code de coût + heures + facturable
  const lignes = entree
    ? entree.lignes.map((l) => ({ code_cout: l.code_cout || "", heures: fmtNb(l.heures), facturable: l.facturable, note: l.note || "" }))
    : [{ code_cout: codeDepart, heures: "", facturable: factParDefaut(), note: "" }];
  const zoneLignes = h("div", { class: "lignes-code" });
  const totalEl = h("div", { class: "total-lignes" });
  const majTotal = () => {
    const t = arrondi2(lignes.reduce((s, l) => s + (lireNombre(l.heures) || 0), 0));
    totalEl.hidden = lignes.length < 2;
    totalEl.replaceChildren("Total de l’entrée : ", h("b", null, fmtH(t)));
  };

  function rendreLignes() {
    const plusieurs = lignes.length > 1;
    zoneLignes.replaceChildren(
      ...lignes.map((l, i) => {
        const sel = selectCodes(l.code_cout, verrouille);
        sel.setAttribute("aria-label", `Code de coût, ligne ${i + 1}`);
        const aide = h("div", { class: "muet petit aide-code" });
        const majAide = () => { const c = codeInfo(sel.value); aide.textContent = c && c.description ? c.description : ""; };
        sel.addEventListener("change", () => { l.code_cout = sel.value; majAide(); });
        majAide();
        const heures = h("input", { type: "text", inputmode: "decimal", placeholder: "Heures", disabled: verrouille, value: l.heures,
          "aria-label": `Heures, ligne ${i + 1}` });
        heures.addEventListener("input", () => { l.heures = heures.value; majTotal(); });
        const bF = h("button", { type: "button", disabled: verrouille }, "Facturable");
        const bN = h("button", { type: "button", disabled: verrouille }, "Non fact.");
        const majF = () => { bF.classList.toggle("actif", l.facturable); bN.classList.toggle("actif", !l.facturable);
          bF.setAttribute("aria-pressed", String(l.facturable)); bN.setAttribute("aria-pressed", String(!l.facturable)); };
        bF.addEventListener("click", () => { l.facturable = true; majF(); });
        bN.addEventListener("click", () => { l.facturable = false; majF(); });
        majF();
        const retirer = plusieurs && !verrouille ? h("button", { type: "button", class: "btn icone retirer", "aria-label": `Retirer la ligne ${i + 1}`,
          onclick: () => { lignes.splice(i, 1); rendreLignes(); } }, "×") : null;
        const desc = h("textarea", { rows: 2, disabled: verrouille, value: l.note, "aria-label": `Description, ligne ${i + 1}`,
          placeholder: "Description des travaux — ex. pose de gypse au 2e étage" });
        desc.addEventListener("input", () => { l.note = desc.value; });
        const raccourcis = !plusieurs && !verrouille ? h("div", { class: "raccourcis" },
          [4, 8, 9, 10].map((n) => h("button", { type: "button", onclick: () => { l.heures = String(n); heures.value = String(n); majTotal(); } }, `${n} h`))) : null;
        return h("div", { class: "ligne-code" + (plusieurs ? " cadre" : "") },
          sel, aide,
          h("div", { class: "lc-bas" }, heures, h("div", { class: "segment petit-seg" }, bF, bN), retirer),
          raccourcis, desc);
      }),
      verrouille ? null : h("button", { type: "button", class: "btn lien ajout-ligne",
        onclick: () => { lignes.push({ code_cout: "", heures: "", facturable: factParDefaut(), note: "" }); rendreLignes();
          const s = zoneLignes.querySelectorAll("select"); if (s.length) s[s.length - 1].focus(); } }, "+ Ajouter un autre code de coût"),
      totalEl);
    majTotal();
  }
  rendreLignes();

  let selEmploye = null;
  if (admin && nouveau) {
    const actifs = [...S.profils.values()].filter((p) => p.actif);
    selEmploye = h("select", { value: employeId || S.moi.id }, actifs.map((p) => h("option", { value: p.id }, p.nom)));
  }

  // pour une nouvelle entrée, « facturable » suit le chantier choisi
  selChantier.addEventListener("change", () => {
    if (!nouveau) return;
    lignes.forEach((l) => { l.facturable = factParDefaut(); });
    rendreLignes();
  });

  const contenu = h("div", null,
    verrouille ? h("div", { class: "alerte info" }, admin
      ? "Ces heures sont dans QuickBooks pour la facturation. Pour les corriger, annule d’abord le transfert (et ajuste-les aussi dans QuickBooks)."
      : "Ces heures ont été transférées dans QuickBooks pour la facturation et ne peuvent plus être modifiées. Demande au bureau si une correction est nécessaire.") : null,
    !admin && !verrouille && entree && entree.statut === "approuve" ? h("div", { class: "alerte jaune" }, "Ces heures sont déjà approuvées. Si tu les modifies, elles retourneront en attente d’approbation.") : null,
    entree && entree.statut === "refuse" ? h("div", { class: "alerte rouge" }, "Refusé", entree.motif_refus ? ` : ${entree.motif_refus}` : "", ". Corrige puis enregistre pour renvoyer.") : null,
    selEmploye ? h("label", { class: "champ" }, h("span", null, "Employé"), selEmploye) : null,
    admin && !nouveau ? h("p", { class: "muet" }, "Employé : ", h("b", null, nomEmploye(entree.employe_id)), " · ", badgeStatut(entree)) : null,
    h("label", { class: "champ" }, h("span", null, "Date"), champDate),
    h("label", { class: "champ" }, h("span", null, "Chantier / projet"), selChantier),
    h("div", { class: "champ" }, h("span", null, "Code de coût, heures et description"), zoneLignes));

  ouvrirModal((fermer) => {
    const enregistrer = h("button", { class: "btn primaire", onclick: (e) => avecAttente(e.currentTarget, async () => {
      if (!champDate.value) { toast("Choisis une date.", "erreur"); return; }
      if (!selChantier.value) { toast("Choisis un chantier.", "erreur"); return; }
      const propres = [];
      for (const [i, l] of lignes.entries()) {
        const num = lignes.length > 1 ? ` (ligne ${i + 1})` : "";
        const hrs = arrondi2(lireNombre(l.heures));
        if (!l.code_cout) { toast(`Choisis un code de coût${num}.`, "erreur"); return; }
        if (!(hrs > 0 && hrs <= 24)) { toast(`Entre un nombre d’heures entre 0 et 24${num}.`, "erreur"); return; }
        if (propres.some((x) => x.code_cout === l.code_cout)) { toast(`Le code ${l.code_cout} est déjà dans cette entrée. Additionne les heures sur une seule ligne.`, "erreur"); return; }
        if (!(l.note || "").trim()) {
          toast(`Décris brièvement les travaux faits${num}.`, "erreur");
          const zones = zoneLignes.querySelectorAll("textarea"); if (zones[i]) zones[i].focus();
          return;
        }
        propres.push({ code_cout: l.code_cout, heures: hrs, facturable: l.facturable, note: l.note.trim() });
      }
      if (somme(propres, (l) => l.heures) > 24) { toast("Le total de l’entrée dépasse 24 heures.", "erreur"); return; }
      const employe = nouveau ? (selEmploye ? selEmploye.value : S.moi.id) : entree.employe_id;
      try {
        await q(sb.rpc("enregistrer_entree", {
          p_groupe: nouveau ? null : entree.groupe,
          p_employe: employe,
          p_date: champDate.value,
          p_chantier: Number(selChantier.value),
          p_note: null,
          p_lignes: propres,
          // les heures ajoutées par un admin sont approuvées d'emblée ; une modification garde le statut
          p_statut: admin ? (nouveau ? "approuve" : entree.statut) : null,
          p_motif: admin && !nouveau ? entree.motif_refus : null,
        }));
        if (employe === S.moi.id) S.derniere = { chantier_id: Number(selChantier.value), code_cout: propres[0].code_cout };
        fermer();
        toast(nouveau ? "Heures ajoutées." : "Modifications enregistrées.");
        await compterEnAttente();
        rendre();
      } catch (err) { erreur(err); }
    }) }, "Enregistrer");

    const supprimer = !nouveau && !verrouille ? h("button", { class: "btn danger", onclick: async () => {
      if (!(await confirmer("Supprimer cette entrée ?", `${fmtH(entree.heures)} le ${dateLongue(versDate(entree.date))} sur ${nomChantier(entree.chantier_id)}${entree.lignes.length > 1 ? ` (${entree.lignes.length} codes de coût)` : ""}.`, "Supprimer", true))) return;
      try {
        await q(sb.from("entrees").delete().in("id", entree.ids));
        fermer();
        toast("Entrée supprimée.");
        await compterEnAttente();
        rendre();
      } catch (err) { erreur(err); }
    } }, "Supprimer") : null;

    const annulerTransfert = verrouille && admin ? h("button", { class: "btn danger", onclick: async () => {
      if (!(await confirmer("Annuler le transfert QuickBooks ?",
        entree.lignes.some((l) => l.qbo_time_activity_id)
          ? "Ces heures seront retirées de QuickBooks et redeviendront modifiables dans l’app. Impossible si elles sont déjà sur une facture : retire-les d’abord de la facture."
          : "Ces heures redeviendront modifiables dans l’app. L’app ne touche pas à QuickBooks : si les heures ou la facture doivent changer, corrige-les aussi là-bas.",
        "Annuler le transfert", true))) return;
      try {
        const envoyeeDirect = entree.lignes.some((l) => l.qbo_time_activity_id);
        if (envoyeeDirect) {
          const r = await appelQbo("annuler", { ids: entree.ids });
          if (r.erreurs && r.erreurs.length) { toast(r.erreurs[0].message, "erreur"); fermer(); rendre(); return; }
        } else {
          await q(sb.from("entrees").update({ exporte_qbo_le: null }).in("id", entree.ids));
        }
        fermer();
        toast(envoyeeDirect ? "Heures retirées de QuickBooks. Elles sont de nouveau modifiables." : "Transfert annulé. Les heures sont de nouveau modifiables.");
        rendre();
      } catch (err) { erreur(err); }
    } }, "Annuler le transfert") : null;

    return {
      titre: nouveau ? "Ajouter des heures" : verrouille ? "Heures dans QuickBooks" : "Modifier les heures",
      contenu,
      actions: verrouille ? [annulerTransfert, h("button", { class: "btn", onclick: fermer }, "Fermer")]
        : [supprimer, h("button", { class: "btn", onclick: fermer }, "Annuler"), enregistrer],
    };
  });
}

/* =====================================================================
   Vue : Mes heures
   ===================================================================== */
function choixModeHeures() {
  return h("div", { class: "segment", style: { marginBottom: "12px" } },
    [["semaine", "Semaine"], ["mois", "Mois"]].map(([cle, nom]) =>
      h("button", { class: (S.modeHeures || "semaine") === cle ? "actif" : "", onclick: () => { S.modeHeures = cle; rendre(); } }, nom)));
}

async function vueMesHeures() {
  if (S.modeHeures === "mois") return h("div", null, choixModeHeures(), await vueCalendrier());
  const lundi = S.semaine;
  const jours = [...Array(7)].map((_, i) => ajouterJours(lundi, i));
  const [rangees, absences] = await Promise.all([
    chargerEntrees({ debut: ymd(lundi), fin: ymd(jours[6]), employeId: S.moi.id }),
    chargerAbsences({ debut: ymd(lundi), fin: ymd(jours[6]), employeId: S.moi.id }),
  ]);
  const groupes = grouper(rangees);
  const aujourdhui = ymd(new Date());
  const total = somme(rangees, (e) => e.heures);
  const refusees = groupes.filter((g) => g.statut === "refuse").length;
  const attente = groupes.filter((g) => g.statut === "soumis").length;
  const approuvees = groupes.filter((g) => g.statut === "approuve").length;

  if (!S.chantiers.some((c) => c.actif)) {
    return h("div", null, navSemaine("semaine"),
      h("div", { class: "alerte jaune" }, estAdmin()
        ? "Aucun chantier actif. Ajoute tes chantiers dans Gestion > Chantiers avant d’entrer des heures."
        : "Aucun chantier n’est configuré pour l’instant. Avise le bureau."));
  }

  return h("div", null,
    choixModeHeures(),
    navSemaine("semaine"),
    h("div", { class: "carte total-semaine" },
      h("span", { class: "chiffre" }, fmtH(total)),
      h("span", { class: "muet" }, "cette semaine"),
      h("span", { class: "espace" }),
      approuvees ? h("span", { class: "badge approuve" }, `${approuvees} approuvée${approuvees > 1 ? "s" : ""}`) : null,
      attente ? h("span", { class: "badge soumis" }, `${attente} en attente`) : null),
    refusees ? h("div", { class: "alerte rouge" }, `${refusees} entrée${refusees > 1 ? "s ont été refusées" : " a été refusée"}. Touche-la pour voir pourquoi et la corriger.`) : null,
    jours.map((jour) => {
      const cle = ymd(jour);
      const duJour = groupes.filter((g) => g.date === cle);
      const absence = absences.find((a) => a.date === cle);
      const fds = jour.getDay() === 0 || jour.getDay() === 6;
      return h("section", { class: "carte jour" + (cle === aujourdhui ? " aujourdhui" : "") + (fds ? " fin-semaine" : "") },
        h("div", { class: "tete" },
          h("span", { class: "nom" }, dateLongue(jour).replace(/^./, (c) => c.toUpperCase())),
          pastilleAbsence(absence),
          h("span", { class: "espace" }),
          duJour.length ? h("span", { class: "gras" }, fmtH(somme(duJour, (g) => g.heures))) : h("span", { class: "muet petit" }, fds || absence ? "" : "Aucune heure")),
        duJour.map((g) => ligneEntree(g)),
        h("div", { class: "ajouter ajouter-jour" },
          h("button", { onclick: () => formEntree({ date: jour }) }, "+ Ajouter des heures"),
          boutonsAbsence(S.moi.id, cle, absence)));
    }));
}

// Une entrée (groupe) dans une liste : chantier, lignes de codes, description
function ligneEntree(g, avecEmploye) {
  const plusieurs = g.lignes.length > 1;
  return h("button", { class: "entree", onclick: () => formEntree({ entree: g }) },
    h("div", { class: "infos" },
      h("div", { class: "chantier" }, nomChantier(g.chantier_id)),
      avecEmploye ? h("div", { class: "note" }, dateCourte(versDate(g.date))) : null,
      g.lignes.map((l) => h("div", { class: "ligne-carte" },
        h("div", { class: "note code" },
          h("span", { class: "lib" }, libelleCode(l.code_cout)),
          plusieurs ? h("span", { class: "h-ligne" }, fmtH(l.heures)) : null,
          !l.facturable ? h("span", { class: "nf" }, "non fact.") : null),
        l.note ? h("div", { class: "note" }, l.note) : null)),
      g.statut === "refuse" && g.motif_refus ? h("div", { class: "motif" }, "Motif : ", g.motif_refus) : null),
    badgeStatut(g),
    h("span", { class: "heures" }, fmtH(g.heures)));
}

/* =====================================================================
   Vue : Calendrier du mois (où on a travaillé)
   ===================================================================== */
const COULEURS_CHANTIERS = ["#c2410c", "#15803d", "#1d4ed8", "#7c3aed", "#0e7490", "#a16207", "#be185d", "#4d7c0f", "#9333ea", "#0f766e", "#b45309", "#475569"];
function couleurChantier(id) {
  const ids = S.chantiers.map((c) => c.id).sort((a, b) => String(a).localeCompare(String(b), "fr", { numeric: true }));
  const i = ids.indexOf(id);
  return COULEURS_CHANTIERS[(i < 0 ? 0 : i) % COULEURS_CHANTIERS.length];
}
const MOIS_LONGS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const COULEURS_ABSENCE = { maladie: "#7c3aed", conge: "#0e7490", ferie: "#4d5a52" };

async function vueCalendrier() {
  const auj = new Date();
  if (!S.mois) S.mois = new Date(auj.getFullYear(), auj.getMonth(), 1);
  const lecteur = estLecteur();
  if (!S.calQui) S.calQui = estComptable() ? "tous" : "moi";
  if (!lecteur) S.calQui = "moi";
  const debut = S.mois, fin = new Date(debut.getFullYear(), debut.getMonth() + 1, 0);
  const employeId = S.calQui === "tous" ? null : S.calQui === "moi" ? S.moi.id : S.calQui;
  const [rangees, absences] = await Promise.all([
    chargerEntrees({ debut: ymd(debut), fin: ymd(fin), employeId }),
    chargerAbsences({ debut: ymd(debut), fin: ymd(fin), employeId }),
  ]);
  const parJour = new Map();
  for (const e of rangees) parJour.set(e.date, (parJour.get(e.date) || []).concat(e));
  const total = somme(rangees, (e) => e.heures);
  const joursTravailles = parJour.size;
  const aujCle = ymd(auj);
  const enCours = debut.getFullYear() === auj.getFullYear() && debut.getMonth() === auj.getMonth();
  if (!S.calJour || S.calJour.slice(0, 7) !== ymd(debut).slice(0, 7)) S.calJour = enCours ? aujCle : null;
  const tous = S.calQui === "tous";

  const changerMois = (n) => { S.mois = new Date(debut.getFullYear(), debut.getMonth() + n, 1); S.calJour = null; rendre(); };
  const nav = h("div", { class: "nav-semaine" },
    h("button", { class: "btn icone", "aria-label": "Mois précédent", onclick: () => changerMois(-1) }, icone("gauche")),
    h("div", { class: "etiquette" }, `${MOIS_LONGS[debut.getMonth()].replace(/^./, (c) => c.toUpperCase())} ${debut.getFullYear()}`,
      h("small", null, enCours ? "Ce mois-ci" : h("button", { class: "btn lien", onclick: () => { S.mois = null; S.calJour = null; rendre(); } }, "Revenir à ce mois-ci"))),
    h("button", { class: "btn icone", "aria-label": "Mois suivant", onclick: () => changerMois(1) }, icone("droite")));

  const filtre = lecteur ? h("div", { class: "cal-filtres" },
    h("select", { "aria-label": "Qui", onchange: (ev) => { S.calQui = ev.target.value; rendre(); } },
      h("option", { value: "tous", selected: S.calQui === "tous" }, "Toute l’équipe"),
      estComptable() ? null : h("option", { value: "moi", selected: S.calQui === "moi" }, "Moi seulement"),
      [...S.profils.values()].filter((p) => p.actif && p.role !== "comptable" && p.id !== S.moi.id)
        .sort((a, b) => a.nom.localeCompare(b.nom, "fr"))
        .map((p) => h("option", { value: p.id, selected: S.calQui === p.id }, p.nom)))) : null;

  // Grille : semaines du lundi au dimanche
  const decalage = (debut.getDay() + 6) % 7;
  const cases = [];
  for (let i = 0; i < decalage; i++) cases.push(h("div", { class: "cal-jour hors", "aria-hidden": "true" }));
  for (let j = 1; j <= fin.getDate(); j++) {
    const d = new Date(debut.getFullYear(), debut.getMonth(), j);
    const cle = ymd(d);
    const liste = parJour.get(cle) || [];
    const heures = somme(liste, (e) => e.heures);
    const chantiers = [...new Set(liste.map((e) => e.chantier_id))];
    const abs = absences.filter((a) => a.date === cle);
    const fds = d.getDay() === 0 || d.getDay() === 6;
    cases.push(h("button", {
      class: "cal-jour" + (fds ? " fds" : "") + (cle === aujCle ? " auj" : "") + (S.calJour === cle ? " choisi" : ""),
      "aria-label": `${dateLongue(d)} : ${heures ? fmtH(heures) : "aucune heure"}`,
      onclick: () => { S.calJour = cle; rendre(); } },
      h("span", { class: "cal-num" }, j),
      heures ? h("span", { class: "cal-h" }, fmtNb(heures)) : null,
      !tous && abs[0] ? h("span", { class: "cal-abs", style: { background: COULEURS_ABSENCE[abs[0].type] } }, TYPES_ABSENCE[abs[0].type].slice(0, 3)) : null,
      chantiers.length ? h("span", { class: "cal-pts" }, chantiers.slice(0, 4).map((id) =>
        h("span", { class: "cal-pt", style: { background: couleurChantier(id) }, title: nomChantier(id) }))) : null));
  }

  // Légende : heures par chantier ce mois-ci
  const parChantier = new Map();
  for (const e of rangees) parChantier.set(e.chantier_id, (parChantier.get(e.chantier_id) || 0) + Number(e.heures));
  const lignesChantier = [...parChantier.entries()].sort((a, b) => b[1] - a[1]);
  const max = lignesChantier.length ? lignesChantier[0][1] : 1;
  const legende = lignesChantier.length ? h("div", { class: "carte" },
    h("div", { class: "section-titre", style: { marginTop: 0 } }, "Chantiers du mois"),
    h("div", { class: "cal-legende" }, lignesChantier.map(([id, hrs]) => h("div", { class: "lg" },
      h("span", { class: "cal-pt", style: { background: couleurChantier(id) } }),
      h("span", { class: "nom" }, nomChantier(id)),
      h("span", { class: "barre", style: { width: `${Math.max(6, Math.round(70 * hrs / max))}px`, background: couleurChantier(id) } }),
      h("span", { class: "gras", style: { fontVariantNumeric: "tabular-nums", minWidth: "56px", textAlign: "right" } }, fmtH(hrs)))))) : null;

  // Détail de la journée choisie
  let detail = null;
  if (S.calJour) {
    const d = versDate(S.calJour);
    const groupes = grouper(parJour.get(S.calJour) || []);
    const absJour = absences.filter((a) => a.date === S.calJour);
    const peutModifier = !estComptable() && S.calQui === "moi";
    const parEmploye = new Map();
    for (const g of groupes) parEmploye.set(g.employe_id, (parEmploye.get(g.employe_id) || []).concat(g));
    const lecture = (g) => h("div", { class: "ligne-lecture" },
      h("span", { class: "cal-pt", style: { background: couleurChantier(g.chantier_id), marginTop: "6px" } }),
      h("div", { style: { flex: 1, minWidth: 0 } },
        h("div", { class: "gras" }, nomChantier(g.chantier_id)),
        g.lignes.map((l) => h("div", { class: "muet petit" }, libelleCode(l.code_cout),
          g.lignes.length > 1 ? ` · ${fmtH(l.heures)}` : "", !l.facturable ? " · non fact." : "", l.note ? ` — ${l.note}` : ""))),
      badgeStatut(g), h("span", { class: "gras", style: { whiteSpace: "nowrap" } }, fmtH(g.heures)));
    detail = h("section", { class: "carte jour cal-detail" },
      h("div", { class: "tete" },
        h("span", { class: "nom" }, dateLongue(d).replace(/^./, (c) => c.toUpperCase())),
        h("span", { class: "espace" }),
        groupes.length ? h("span", { class: "gras" }, fmtH(somme(groupes, (g) => g.heures))) : null),
      absJour.length ? h("div", { class: "absences-ligne" }, absJour.map((a) =>
        h("span", { class: "badge abs abs-" + a.type }, tous ? `${nomEmploye(a.employe_id)} : ${TYPES_ABSENCE[a.type]}` : TYPES_ABSENCE[a.type]))) : null,
      groupes.length === 0 ? h("div", { class: "vide", style: { borderTop: "1px solid var(--ligne)" } }, "Aucune heure ce jour-là.") : null,
      tous || S.calQui !== "moi"
        ? [...parEmploye.entries()].map(([emp, gs]) => [
            tous ? h("div", { class: "section-titre", style: { margin: "10px 14px 2px" } }, `${nomEmploye(emp)} · ${fmtH(somme(gs, (g) => g.heures))}`) : null,
            gs.map(lecture)])
        : groupes.map((g) => peutModifier ? ligneEntree(g) : lecture(g)),
      peutModifier ? h("div", { class: "ajouter" }, h("button", { onclick: () => formEntree({ date: d }) }, "+ Ajouter des heures")) : null);
  }

  return h("div", null,
    filtre, nav,
    h("div", { class: "carte total-semaine" },
      h("span", { class: "chiffre" }, fmtH(total)),
      h("span", { class: "muet" }, `ce mois-ci · ${joursTravailles} jour${joursTravailles > 1 ? "s" : ""} travaillé${joursTravailles > 1 ? "s" : ""}`)),
    h("div", { class: "carte cal" },
      h("div", { class: "cal-grille" },
        ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map((j) => h("div", { class: "cal-tete" }, j)),
        cases)),
    detail, legende);
}

/* =====================================================================
   Vue : Approbation (admin)
   ===================================================================== */
async function changerStatut(ids, statut, motif) {
  if (!ids.length) return;
  const donnees = { statut, motif_refus: statut === "refuse" ? motif || null : null };
  await q(sb.from("entrees").update(donnees).in("id", ids));
  await compterEnAttente();
}

async function vueApprobation() {
  const lundi = S.semaineAdmin;
  const [rangees, absencesSemaine] = await Promise.all([
    chargerEntrees({ debut: ymd(lundi), fin: ymd(ajouterJours(lundi, 6)) }),
    chargerAbsences({ debut: ymd(lundi), fin: ymd(ajouterJours(lundi, 6)) }),
  ]);
  const parEmploye = new Map();
  for (const p of S.profils.values()) if (p.actif) parEmploye.set(p.id, []);
  for (const e of rangees) {
    if (!parEmploye.has(e.employe_id)) parEmploye.set(e.employe_id, []);
    parEmploye.get(e.employe_id).push(e);
  }
  const enAttente = grouper(rangees).filter((g) => g.statut === "soumis");

  const toutApprouver = enAttente.length ? h("button", { class: "btn vert plein", style: { marginBottom: "12px" }, onclick: (ev) => avecAttente(ev.currentTarget, async () => {
    if (!(await confirmer("Tout approuver ?", `${enAttente.length} entrée${enAttente.length > 1 ? "s" : ""} en attente pour la semaine du ${etiquetteSemaine(lundi)}.`, "Approuver tout"))) return;
    try { await changerStatut(idsDe(enAttente), "approuve"); toast("Semaine approuvée."); rendre(); } catch (err) { erreur(err); }
  }) }, `Approuver toute la semaine (${enAttente.length})`) : null;

  const cartes = [...parEmploye.entries()]
    .sort((a, b) => nomEmploye(a[0]).localeCompare(nomEmploye(b[0]), "fr"))
    .map(([id, liste]) => {
      const groupes = grouper(liste);
      const attente = groupes.filter((g) => g.statut === "soumis");
      const sesAbsences = absencesSemaine.filter((a) => a.employe_id === id);
      return h("section", { class: "carte jour" },
        h("div", { class: "tete" },
          h("span", { class: "nom" }, nomEmploye(id)),
          attente.length ? h("span", { class: "badge soumis" }, `${attente.length} en attente`) : null,
          h("span", { class: "espace" }),
          h("span", { class: "gras" }, fmtH(somme(liste, (e) => e.heures)))),
        sesAbsences.length ? h("div", { class: "absences-ligne" }, sesAbsences.map((a) =>
          h("button", { class: "badge abs abs-" + a.type, title: "Changer ou retirer", onclick: () => formAbsence(id, a.date, a) },
            `${TYPES_ABSENCE[a.type]} · ${dateCourte(versDate(a.date))}`))) : null,
        groupes.length ? groupes.map((g) => h("div", { class: "ligne-flex", style: { borderTop: "1px solid var(--ligne)" } },
          h("div", { style: { flex: "1", minWidth: "0" } }, (() => { const l = ligneEntree(g, true); l.style.borderTop = "0"; return l; })()),
          estVerrouillee(g) ? h("span", { style: { width: "10px" } }) : null,
          !estVerrouillee(g) && g.statut !== "approuve" ? h("button", { class: "btn petit vert", title: "Approuver", onclick: (ev) => avecAttente(ev.currentTarget, async () => {
            try { await changerStatut(g.ids, "approuve"); rendre(); } catch (err) { erreur(err); }
          }) }, "✓") : null,
          estVerrouillee(g) ? null : g.statut !== "refuse" ? h("button", { class: "btn petit danger", title: "Refuser", style: { marginRight: "10px" }, onclick: async () => {
            const motif = await demanderTexte("Refuser ces heures", "Motif (l’employé le verra)", "Refuser");
            if (motif === null) return;
            try { await changerStatut(g.ids, "refuse", motif); toast("Entrée refusée."); rendre(); } catch (err) { erreur(err); }
          } }, "✗") : h("span", { style: { width: "10px" } })))
          : h("div", { class: "vide", style: { borderTop: "1px solid var(--ligne)" } }, "Aucune heure entrée cette semaine."),
        h("div", { class: "ajouter" },
          attente.length ? h("button", { style: { color: "var(--vert)" }, onclick: (ev) => avecAttente(ev.currentTarget, async () => {
            try { await changerStatut(idsDe(attente), "approuve"); toast(`Heures de ${nomEmploye(id)} approuvées.`); rendre(); } catch (err) { erreur(err); }
          }) }, attente.length > 1 ? `✓ Approuver les ${attente.length} entrées de ${nomEmploye(id)}` : `✓ Approuver l’entrée de ${nomEmploye(id)}`) : null,
          h("button", { onclick: () => formEntree({ date: lundi, employeId: id }) }, "+ Ajouter des heures pour " + nomEmploye(id)),
          h("button", { class: "muet", onclick: () => formAbsence(id, ymd(lundi)) }, "Marquer une journée non travaillée")));
    });

  return h("div", null, navSemaine("semaineAdmin"), toutApprouver,
    !enAttente.length && rangees.length ? h("div", { class: "alerte info" }, "Tout est approuvé pour cette semaine.") : null,
    cartes);
}

// Le bureau marque une absence pour un employé (choix de la date et du type)
function formAbsence(employeId, dateDepart, actuelle) {
  const champDate = h("input", { type: "date", value: dateDepart, disabled: Boolean(actuelle) });
  let type = actuelle ? actuelle.type : "maladie";
  const boutons = Object.entries(TYPES_ABSENCE).map(([t, lib]) => h("button", { type: "button", "data-type": t, class: t === type ? "actif" : "",
    onclick: () => { type = t; boutons.forEach((b) => b.classList.toggle("actif", b.dataset.type === t)); } }, lib));
  ouvrirModal((fermer) => ({
    titre: `${nomEmploye(employeId)} — journée non travaillée`,
    contenu: h("div", null,
      h("label", { class: "champ" }, h("span", null, "Date"), champDate),
      h("div", { class: "champ" }, h("span", null, "Raison"), h("div", { class: "segment" }, boutons)),
      h("p", { class: "muet petit" }, "C’est seulement un repère : aucune heure n’est ajoutée à la paie ni à QuickBooks.")),
    actions: [
      actuelle ? h("button", { class: "btn danger", onclick: (e) => avecAttente(e.currentTarget, async () => {
        try { await q(sb.from("absences").delete().eq("id", actuelle.id)); fermer(); rendre(); } catch (err) { erreur(err); }
      }) }, "Retirer") : null,
      h("button", { class: "btn", onclick: fermer }, "Annuler"),
      h("button", { class: "btn primaire", onclick: (e) => avecAttente(e.currentTarget, async () => {
        if (!champDate.value) { toast("Choisis une date.", "erreur"); return; }
        try {
          if (actuelle) await q(sb.from("absences").update({ type }).eq("id", actuelle.id));
          else {
            const existe = (await chargerAbsences({ debut: champDate.value, fin: champDate.value, employeId }))[0];
            if (existe) await q(sb.from("absences").update({ type }).eq("id", existe.id));
            else await q(sb.from("absences").insert({ employe_id: employeId, date: champDate.value, type }));
          }
          fermer(); toast("Journée marquée."); rendre();
        } catch (err) { erreur(err); }
      }) }, "Enregistrer"),
    ],
  }));
}

   Vue : Rapports par chantier (admin)

function selecteurPeriode(etat, apresChangement) {
  const debut = h("input", { type: "date", value: etat.debut, onchange: (e) => { etat.debut = e.target.value; apresChangement(); } });
  const fin = h("input", { type: "date", value: etat.fin, onchange: (e) => { etat.fin = e.target.value; apresChangement(); } });
  return h("div", null,
    h("div", { class: "puces" }, Object.entries(plages()).map(([nom, [d, f]]) =>
      h("button", { onclick: () => { etat.debut = ymd(d); etat.fin = ymd(f); apresChangement(); } }, nom))),
    h("div", { class: "rangee" },
      h("label", { class: "champ" }, h("span", null, "Du"), debut),
      h("label", { class: "champ" }, h("span", null, "Au"), fin)));
}

async function vueRapports() {
  const onglets = [["chantier", "Par chantier"], ["sommaire", "Tous les chantiers"]];
  const contenu = S.rapportOnglet === "sommaire" ? await vueSommaire() : await vueRapportChantier();
  return h("div", null,
    h("div", { class: "onglets no-print" }, onglets.map(([cle, nom]) =>
      h("button", { class: S.rapportOnglet === cle ? "actif" : "", onclick: () => { S.rapportOnglet = cle; rendre(); } }, nom))),

}

const dateTexte = (s) => { const d = versDate(s); return `${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`; };

// Rapport d'un chantier pour une période (ex. un cycle de facturation) : qui a fait quoi
async function vueRapportChantier() {
  const RC = S.rc;
  const choix = [...S.chantiers].sort((a, b) => (b.actif - a.actif) || a.nom.localeCompare(b.nom, "fr"));
  if (!choix.length) return h("div", { class: "vide" }, "Aucun chantier. Ajoute tes chantiers dans Gestion > Chantiers.");
  if (!choix.some((c) => c.id === RC.chantierId)) RC.chantierId = choix[0].id;
  const c = choix.find((x) => x.id === RC.chantierId);
  const taux = (id) => Number((S.profils.get(id) || {}).taux || 0);

  const brutes = await chargerEntrees({ debut: RC.debut, fin: RC.fin, chantierId: c.id });
  const entrees = brutes.filter((e) => RC.tout ? e.statut !== "refuse" : e.statut === "approuve");
  const enAttente = grouper(brutes.filter((e) => e.statut === "soumis")).length;
  const tot = {
    heures: somme(entrees, (e) => e.heures),
    fact: somme(entrees.filter((e) => e.facturable), (e) => e.heures),
    cout: somme(entrees, (e) => e.heures * taux(e.employe_id)),
  };
  const regrouper = (cle) => {
    const m = new Map();
    for (const e of entrees) m.set(cle(e), (m.get(cle(e)) || []).concat(e));
    return m;
  };
  const ordreCode = (code) => { const x = codeInfo(code); return x ? x.ordre : 9999; };
  const parCode = [...regrouper((e) => e.code_cout || "").entries()].sort((a, b) => ordreCode(a[0]) - ordreCode(b[0]));
  const parEmp = [...regrouper((e) => e.employe_id).entries()].sort((a, b) => nomEmploye(a[0]).localeCompare(nomEmploye(b[0]), "fr"));
  const ligneTotaux = (libelle, liste) => h("tr", null,
    h("td", null, libelle),
    h("td", { class: "num" }, fmtNb(somme(liste, (e) => e.heures))),
    h("td", { class: "num" }, fmtNb(somme(liste.filter((e) => e.facturable), (e) => e.heures))),
    h("td", { class: "num" }, fmtArgent(somme(liste, (e) => e.heures * taux(e.employe_id)))));
  const tableTotaux = (titre, col, lignes) => h("div", { class: "table-wrap" }, h("table", null,
    h("thead", null, h("tr", null, h("th", null, col), h("th", { class: "num" }, "Heures"), h("th", { class: "num" }, "Factur."), h("th", { class: "num" }, "Coût m.-o."))),
    h("tbody", null, lignes, h("tr", { class: "total" }, h("td", null, "Total"),
      h("td", { class: "num" }, fmtNb(tot.heures)), h("td", { class: "num" }, fmtNb(tot.fact)), h("td", { class: "num" }, fmtArgent(tot.cout))))));

  // Journal : jour par jour, qui a fait quoi
  const jours = [...regrouper((e) => e.date).entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const corpsJournal = [];
  for (const [date, liste] of jours) {
    liste.sort((a, b) => nomEmploye(a.employe_id).localeCompare(nomEmploye(b.employe_id), "fr") || ordreCode(a.code_cout) - ordreCode(b.code_cout));
    liste.forEach((e, i) => corpsJournal.push(h("tr", { class: i === 0 ? "debut-jour" : "" },
      h("td", { class: "date-j" }, i === 0 ? dateCourte(versDate(date)) : ""),
      h("td", null, nomEmploye(e.employe_id)),
      h("td", { class: "code-j" }, libelleCode(e.code_cout)),
      h("td", { class: "desc-j" }, e.note || "",
        !e.facturable ? h("span", { class: "tag-nf" }, " non fact.") : null,
        e.statut === "soumis" ? h("span", { class: "badge soumis", style: { marginLeft: "6px" } }, "En attente") : null),
      h("td", { class: "num" }, fmtNb(e.heures)))));
    corpsJournal.push(h("tr", { class: "sous-total-j" }, h("td"), h("td", { colspan: "3" }, `Total du ${dateCourte(versDate(date))}`), h("td", { class: "num" }, fmtNb(somme(liste, (e) => e.heures)))));
  }

  const exporter = () => {
    const rangees = [["Chantier", "Client/projet QuickBooks", "Date", "Employé", "Code de coût", "Libellé du code", "Description", "Heures", "Facturable", "Statut"]];
    for (const [, liste] of jours) for (const e of liste) {
      const cc = codeInfo(e.code_cout) || {};
      rangees.push([c.nom, nomQuickBooks(c), e.date, nomEmploye(e.employe_id), e.code_cout || "", cc.libelle || "", e.note || "", Number(e.heures), e.facturable ? "Oui" : "Non", e.statut]);
    }
    telecharger(`rapport_${c.nom.replace(/[^\p{L}\p{N}]+/gu, "_")}_${RC.debut}_au_${RC.fin}.csv`, versCSV(rangees), "text/csv;charset=utf-8");
  };

  const champChantier = h("select", { id: "rc-chantier", value: String(c.id), onchange: (ev) => { RC.chantierId = Number(ev.target.value); rendre(); } },
    choix.map((x) => h("option", { value: String(x.id) }, x.nom + (x.client ? ` (${x.client})` : "") + (x.actif ? "" : " — archivé"))));

  return h("div", null,
    h("div", { class: "carte no-print" },
      h("label", { class: "champ" }, h("span", null, "Chantier"), champChantier),
      selecteurPeriode(RC, rendre),
      h("label", { class: "case", style: { marginBottom: 0 } },

async function vueSommaire() {
  const R = S.rapport;
  const entreesBrutes = await chargerEntrees({ debut: R.debut, fin: R.fin });
  const entrees = entreesBrutes.filter((e) => R.tout ? e.statut !== "refuse" : e.statut === "approuve");
  const nonApprouvees = entreesBrutes.filter((e) => e.statut === "soumis").length;
  const taux = (id) => Number((S.profils.get(id) || {}).taux || 0);

  const parChantier = new Map();
  for (const e of entrees) {
    if (!parChantier.has(e.chantier_id)) parChantier.set(e.chantier_id, []);
    parChantier.get(e.chantier_id).push(e);
  }
  const lignes = [...parChantier.entries()].map(([id, liste]) => ({
    id, nom: nomChantier(id), liste,
    heures: somme(liste, (e) => e.heures),
    facturables: somme(liste.filter((e) => e.facturable), (e) => e.heures),
    cout: somme(liste, (e) => e.heures * taux(e.employe_id)),
  })).sort((a, b) => b.heures - a.heures);
  const sansTaux = [...new Set(entrees.map((e) => e.employe_id))].filter((id) => !taux(id));

  const corps = [];
  for (const l of lignes) {
    const ouvert = R.ouverts.has(l.id);
    corps.push(h("tr", { style: { cursor: "pointer" }, onclick: () => { ouvert ? R.ouverts.delete(l.id) : R.ouverts.add(l.id); rendre(); } },
      h("td", { class: "gras" }, ouvert ? "▾ " : "▸ ", l.nom),
      h("td", { class: "num" }, fmtNb(l.heures)),
      h("td", { class: "num" }, fmtNb(l.facturables)),
      h("td", { class: "num" }, fmtArgent(l.cout))));
    if (ouvert) {
      // détail par code de coût (ordre de la nomenclature) ou par employé
      const parCode = R.detail !== "employe";
      const cle = (e) => parCode ? (e.code_cout || "") : e.employe_id;
      const groupes = new Map();
      for (const e of l.liste) groupes.set(cle(e), (groupes.get(cle(e)) || []).concat(e));
      const ordreCode = (code) => { const c = codeInfo(code); return c ? c.ordre : 9999; };
      const cles = [...groupes.keys()].sort((a, b) => parCode ? ordreCode(a) - ordreCode(b) || a.localeCompare(b) : nomEmploye(a).localeCompare(nomEmploye(b), "fr"));
      for (const k of cles) {
        const le = groupes.get(k);
        corps.push(h("tr", { class: "sous" },
          h("td", null, parCode ? libelleCode(k) : nomEmploye(k)),
          h("td", { class: "num" }, fmtNb(somme(le, (e) => e.heures))),
          h("td", { class: "num" }, fmtNb(somme(le.filter((e) => e.facturable), (e) => e.heures))),
          h("td", { class: "num" }, fmtArgent(somme(le, (e) => e.heures * taux(e.employe_id))))));
      }
    }
  }
  corps.push(h("tr", { class: "total" },
    h("td", null, "Total"),
    h("td", { class: "num" }, fmtNb(somme(lignes, (l) => l.heures))),
    h("td", { class: "num" }, fmtNb(somme(lignes, (l) => l.facturables))),
    h("td", { class: "num" }, fmtArgent(somme(lignes, (l) => l.cout)))));

  const exporter = () => {
    const rangees = [["Date", "Employé", "Chantier", "Client", "Code de coût", "Libellé du code", "Heures", "Facturable", "Taux", "Coût", "Statut", "Description"]];
    for (const e of [...entrees].sort((a, b) => a.date.localeCompare(b.date))) {
      const c = S.chantiers.find((x) => x.id === e.chantier_id) || {};
      const cc = codeInfo(e.code_cout) || {};
      rangees.push([e.date, nomEmploye(e.employe_id), c.nom || "", c.client || "", e.code_cout || "", cc.libelle || "", Number(e.heures), e.facturable ? "Oui" : "Non",
        taux(e.employe_id), arrondi2(e.heures * taux(e.employe_id)), e.statut, e.note || ""]);
    }
    telecharger(`heures_chantiers_${R.debut}_au_${R.fin}.csv`, versCSV(rangees), "text/csv;charset=utf-8");
  };

  return h("div", null,
    h("div", { class: "carte" },
      selecteurPeriode(R, rendre),
      h("label", { class: "case", style: { marginBottom: 0 } },
        h("input", { type: "checkbox", checked: R.tout, onchange: (e) => { R.tout = e.target.checked; rendre(); } }),
        h("span", null, "Inclure les heures pas encore approuvées")),
      h("div", { style: { marginTop: "12px" } },
        h("div", { class: "muet petit", style: { marginBottom: "5px" } }, "Détail des chantiers"),
        h("div", { class: "segment" },
          h("button", { class: R.detail !== "employe" ? "actif" : "", onclick: () => { R.detail = "code"; rendre(); } }, "Par code"),
          h("button", { class: R.detail === "employe" ? "actif" : "", onclick: () => { R.detail = "employe"; rendre(); } }, "Par employé")))),
    !R.tout && nonApprouvees ? h("div", { class: "alerte jaune" }, `${nonApprouvees} entrée${nonApprouvees > 1 ? "s" : ""} en attente d’approbation ne sont pas comptées.`) : null,
    sansTaux.length ? h("div", { class: "alerte jaune" }, "Taux horaire manquant pour : ", sansTaux.map(nomEmploye).join(", "), ". Leur coût compte pour 0 $ (Gestion > Employés).") : null,
    h("div", { class: "carte" },
      lignes.length ? h("div", { class: "table-wrap" }, h("table", null,
        h("thead", null, h("tr", null, h("th", null, "Chantier"), h("th", { class: "num" }, "Heures"), h("th", { class: "num" }, "Factur."), h("th", { class: "num" }, "Coût m.-o."))),
        h("tbody", null, corps)))
        : h("div", { class: "vide" }, "Aucune heure pour cette période."),
      lignes.length ? h("p", { class: "muet petit", style: { marginBottom: 0 } }, "Coût de main-d’œuvre = heures × taux horaire actuel de l’employé (sans charges sociales). Touche un chantier pour voir le détail.") : null),
    lignes.length ? h("button", { class: "btn plein", onclick: exporter }, "Télécharger le détail (CSV / Excel)") : null);
}

async function vuePaie() {
  const P = S.paie;
  const [entrees, absences] = await Promise.all([chargerEntrees({ debut: P.debut, fin: P.fin }), chargerAbsences({ debut: P.debut, fin: P.fin })]);
  const resumeAbsences = (id) => Object.entries(TYPES_ABSENCE)
    .map(([t, lib]) => { const n = absences.filter((a) => a.employe_id === id && a.type === t).length; return n ? `${lib} ${n} j` : null; })
    .filter(Boolean).join(" · ");
  const employes = [...S.profils.values()].filter((p) => p.actif || entrees.some((e) => e.employe_id === p.id));
  const lignes = employes.map((p) => {
    const siennes = entrees.filter((e) => e.employe_id === p.id);
    return {
      p,
      approuvees: somme(siennes.filter((e) => e.statut === "approuve"), (e) => e.heures),
      attente: somme(siennes.filter((e) => e.statut === "soumis"), (e) => e.heures),
    };
  }).filter((l) => l.approuvees || l.attente || l.p.actif);

  const totalAttente = somme(lignes, (l) => l.attente);

  const manqueParams = !S.params.no_compagnie || !S.params.code_gain;
  const aExporter = lignes.filter((l) => l.approuvees > 0);
  const bloque = !aExporter.length || sansMatricule.length > 0 || manqueParams;

  const exporterEmployeurD = () => {
    const donnees = aExporter.map((l) => ({
      noCompagnie: S.params.no_compagnie, matricule: l.p.matricule, periode: P.fin,
      codeGain: S.params.code_gain, heures: l.approuvees, nom: l.p.nom,

    XLSX.utils.book_append_sheet(classeur, feuille, "Transactions");
    XLSX.writeFile(classeur, `employeur_d_${P.fin}.xls`, { bookType: "biff8" });
    toast("Fichier téléchargé. Importe-le dans Employeur D.");

  const exporterDetail = () => {

    for (const e of entrees.filter((x) => x.statut === "approuve").sort((a, b) => nomEmploye(a.employe_id).localeCompare(nomEmploye(b.employe_id), "fr") || a.date.localeCompare(b.date))) {
      const p = S.profils.get(e.employe_id) || {};

  };

  return h("div", null,
    h("div", { class: "carte" },
      h("h3", { style: { marginBottom: "10px" } }, "Période de paie"),
      selecteurPeriode(P, rendre),
      h("p", { class: "muet petit", style: { margin: 0 } }, `La date de fin (${P.fin}) sera inscrite comme période dans le fichier. Elle doit correspondre au dernier jour de la période de paie dans Employeur D, sinon l’import échoue.`)),
    totalAttente ? h("div", { class: "alerte jaune" }, `${fmtH(totalAttente)} sont encore en attente d’approbation et ne seront pas exportées. `,
      h("button", { class: "btn lien", onclick: () => { S.semaineAdmin = lundiDe(versDate(P.debut)); allerA("approbation"); } }, "Aller approuver")) : null,
    manqueParams ? h("div", { class: "alerte rouge" }, "Le numéro de compagnie et le code de gain Employeur D sont requis. ",
      h("button", { class: "btn lien", onclick: () => { S.gestion = "parametres"; allerA("gestion"); } }, "Les entrer")) : null,
    sansMatricule.length ? h("div", { class: "alerte rouge" }, "Matricule Employeur D manquant pour : ", sansMatricule.map((l) => l.p.nom).join(", "), ". ",
      h("button", { class: "btn lien", onclick: () => { S.gestion = "employes"; allerA("gestion"); } }, "Les ajouter")) : null,
    h("div", { class: "carte" },
      h("div", { class: "table-wrap" }, h("table", null,
        h("thead", null, h("tr", null, h("th", null, "Employé"), h("th", null, "Matr."), h("th", { class: "num" }, "Approuv."), h("th", { class: "num" }, "Attente"))),
        h("tbody", null,
          lignes.map((l) => h("tr", null,
            h("td", null, h("div", { class: "gras" }, l.p.nom), resumeAbsences(l.p.id) ? h("div", { class: "muet petit" }, resumeAbsences(l.p.id)) : null),
            h("td", null, l.p.matricule || h("span", { style: { color: "var(--rouge)" } }, "—")),
            h("td", { class: "num" }, fmtNb(l.approuvees)),
            h("td", { class: "num" }, l.attente ? h("span", { style: { color: "var(--jaune)" } }, fmtNb(l.attente)) : "—"))),
          h("tr", { class: "total" }, h("td", null, "Total"), h("td"),

}

  const onglets = [["paie", "Paie (Employeur D)"], ["qbo", "QuickBooks"]];
  const contenu = S.export === "qbo" ? await vueQuickBooks() : await vuePaie();
  return h("div", null,
    h("div", { class: "onglets" }, onglets.map(([cle, nom]) =>
      h("button", { class: S.export === cle ? "actif" : "", onclick: () => { S.export = cle; rendre(); } }, nom))),
