function nomQuickBooks(c) { return (c && (c.qbo_nom || c.client)) || ""; }
function csvQuickBooks(entrees) {
  const rangees = [["Date", "Employé", "Client/projet QuickBooks", "Chantier", "Code de coût", "Libellé du code", "Heures", "Facturable", "Description"]];
  const triees = [...entrees].sort((a, b) =>
    nomChantier(a.chantier_id).localeCompare(nomChantier(b.chantier_id), "fr") ||
    nomEmploye(a.employe_id).localeCompare(nomEmploye(b.employe_id), "fr") || a.date.localeCompare(b.date));
  for (const e of triees) {
    const c = S.chantiers.find((x) => x.id === e.chantier_id) || {};
    const cc = codeInfo(e.code_cout) || {};
    rangees.push([e.date, nomEmploye(e.employe_id), nomQuickBooks(c), c.nom || "", e.code_cout || "", cc.libelle || "", Number(e.heures), e.facturable ? "Oui" : "Non", e.note || ""]);
  }
  return versCSV(rangees);
}

async function vueQuickBooks() {
  const Q = S.qbo;
  const entrees = await chargerEntrees({ debut: Q.debut, fin: Q.fin });
  const aTransferer = entrees.filter((e) => e.statut === "approuve" && !estVerrouillee(e));
  const deja = entrees.filter(estVerrouillee);
  const enAttente = entrees.filter((e) => e.statut === "soumis");
  const refusees = grouper(entrees.filter((e) => e.statut === "refuse"));

  const parChantier = new Map();
  for (const e of aTransferer) parChantier.set(e.chantier_id, (parChantier.get(e.chantier_id) || []).concat(e));
  const lignes = [...parChantier.entries()].map(([id, liste]) => {
    const c = S.chantiers.find((x) => x.id === id) || {};
    return { nom: nomChantier(id), client: c.qbo_nom || c.client || "", lie: Boolean(qboConnecte() ? c.qbo_customer_id : c.qbo_nom), heures: somme(liste, (e) => e.heures), facturables: somme(liste.filter((e) => e.facturable), (e) => e.heures) };
  }).sort((a, b) => a.nom.localeCompare(b.nom, "fr"));

  const totalH = somme(aTransferer, (e) => e.heures);
  const direct = qboConnecte();
  const manquants = direct ? correspondancesManquantes(aTransferer) : [];

  // Envoi direct dans QuickBooks (connexion active)
  const envoyer = (ev) => avecAttente(ev.currentTarget, async () => {
    const nb = grouper(aTransferer).length;
    const ok = await confirmer("Envoyer à QuickBooks ?",
      `${nb} entrée${nb > 1 ? "s" : ""} (${fmtH(totalH)}) seront créées dans QuickBooks${S.qboStatut.entreprise ? ` (${S.qboStatut.entreprise})` : ""}, puis verrouillées dans l’app.`,
      "Envoyer");
    if (!ok) return;
    try {
      const ids = aTransferer.map((e) => e.id);
      let envoyees = 0; const erreurs = []; let manque = [];
      for (let i = 0; i < ids.length; i += 200) {
        const r = await appelQbo("envoyer", { ids: ids.slice(i, i + 200) });
        envoyees += r.envoyees || 0; erreurs.push(...(r.erreurs || [])); manque = manque.concat(r.manquants || []);
        if (r.manquants && r.manquants.length) break;
      }
      if (manque.length) {
        ouvrirModal((fermer) => ({ titre: "Correspondances à faire", contenu: h("div", null,
          h("p", null, "Rien n’a été envoyé. Associe d’abord à QuickBooks :"), h("ul", null, manque.map((m) => h("li", null, m)))),
          actions: [h("button", { class: "btn", onclick: fermer }, "Fermer"),
            h("button", { class: "btn primaire", onclick: () => { fermer(); S.gestion = "quickbooks"; allerA("gestion"); } }, "Les associer")] }));
      } else if (erreurs.length) {
        ouvrirModal((fermer) => ({ titre: `${envoyees} envoyée${envoyees > 1 ? "s" : ""}, ${erreurs.length} refusée${erreurs.length > 1 ? "s" : ""}`, contenu: h("div", null,
          h("p", null, "QuickBooks a refusé ces lignes. Elles restent à envoyer :"),
          h("ul", null, erreurs.map((x) => { const e = aTransferer.find((y) => y.id === x.id) || {}; return h("li", null, h("b", null, `${nomEmploye(e.employe_id)}, ${e.date} : `), x.message); }))),
          actions: [h("button", { class: "btn primaire", onclick: fermer }, "OK")] }));
      } else {
        toast(`${envoyees} ligne${envoyees > 1 ? "s" : ""} envoyée${envoyees > 1 ? "s" : ""} à QuickBooks.`);
      }
      rendre();
    } catch (err) { erreur(err); rendre(); }
  });

  const transferer = (ev) => avecAttente(ev.currentTarget, async () => {
    const ok = await confirmer("Transférer à QuickBooks ?",
      `${grouper(aTransferer).length} entrée${grouper(aTransferer).length > 1 ? "s" : ""} (${fmtH(totalH)}) seront verrouillées : les employés ne pourront plus les modifier. Le fichier des heures sera téléchargé pour les entrer dans QuickBooks.`,
      "Transférer et verrouiller");
    if (!ok) return;
    try {
      const maintenant = new Date().toISOString();
      const ids = aTransferer.map((e) => e.id);
      for (let i = 0; i < ids.length; i += 200) {
        await q(sb.from("entrees").update({ exporte_qbo_le: maintenant }).in("id", ids.slice(i, i + 200)));
      }
      telecharger(`quickbooks_${Q.debut}_au_${Q.fin}.csv`, csvQuickBooks(aTransferer), "text/csv;charset=utf-8");
      toast("Heures verrouillées et fichier téléchargé.");
      rendre();
    } catch (err) { erreur(err); rendre(); }
  });

  return h("div", null,
    h("div", { class: "carte" },
      h("h3", { style: { marginBottom: "10px" } }, "Période à facturer"),
      selecteurPeriode(Q, rendre),
      h("p", { class: "muet petit", style: { margin: 0 } }, "Seules les heures approuvées sont transférées. Une fois transférées, elles sont verrouillées pour tout le monde.")),
    enAttente.length ? h("div", { class: "alerte jaune" }, `${fmtH(somme(enAttente, (e) => e.heures))} encore en attente d’approbation ne seront pas transférées. `,
      h("button", { class: "btn lien", onclick: () => { S.semaineAdmin = lundiDe(versDate(Q.debut)); allerA("approbation"); } }, "Aller approuver")) : null,
    direct && manquants.length ? h("div", { class: "alerte rouge" }, "Avant d’envoyer, associe à QuickBooks : ", manquants.join(", "), ". ",
      h("button", { class: "btn lien", onclick: () => { S.gestion = "quickbooks"; allerA("gestion"); } }, "Les associer")) : null,

/* ---------- Import de la liste des clients/projets QuickBooks ---------- */
// Lit un export Excel/CSV de QuickBooks et en tire les noms de clients/projets.
// Les projets et sous-clients apparaissent sous la forme « Client:Projet ».
function lireListeQuickBooks(rangees) {
  const texte = (v) => String(v === null || v === undefined ? "" : v).trim();
  const titresNom = /^(client|customer|nom du client|nom complet du client|customer full name|full name|nom d.affichage|display name|nom|name)$/i;
  const titresProjet = /^(projet|project|nom du projet|project name)$/i;
  let ligneTitre = -1, colNom = -1, colProjet = -1;
  for (let i = 0; i < Math.min(rangees.length, 15) && ligneTitre < 0; i++) {
    const r = (rangees[i] || []).map(texte);
    // priorité aux titres les plus précis
    const idx = r.findIndex((c) => /^(client|customer|nom du client|nom complet du client|customer full name)$/i.test(c));
    const j = idx >= 0 ? idx : r.findIndex((c) => titresNom.test(c));
    if (j >= 0) { ligneTitre = i; colNom = j; colProjet = r.findIndex((c) => titresProjet.test(c)); }
  }
  if (ligneTitre < 0) { ligneTitre = -1; colNom = 0; }   // pas de titre : 1re colonne
  const vus = new Set();
  const items = [];
  for (const r of rangees.slice(ligneTitre + 1)) {
    let nomComplet = texte((r || [])[colNom]);
    if (!nomComplet || /^total/i.test(nomComplet)) continue;
    const projet = colProjet >= 0 ? texte(r[colProjet]) : "";
    if (projet) nomComplet = `${nomComplet}:${projet}`;
    if (vus.has(nomComplet)) continue;
    vus.add(nomComplet);
    const parties = nomComplet.split(":").map((x) => x.trim()).filter(Boolean);
    items.push({ qboNom: nomComplet, nom: parties[parties.length - 1], client: parties[0] });
  }
  return items;
}

function importerQuickBooks() {
  const zone = h("div");
  const fichier = h("input", { type: "file", accept: ".xlsx,.xls,.csv" });
  let items = [];
  const boutonImporter = h("button", { class: "btn primaire", disabled: true }, "Importer");

  const afficher = () => {
    const cases = items.map((it) => {
      const lie = S.chantiers.find((c) => (it.qboId && c.qbo_customer_id === it.qboId) || (c.qbo_nom && c.qbo_nom.toLowerCase() === it.qboNom.toLowerCase()));
      const memeNom = !lie && S.chantiers.find((c) => !c.qbo_nom && c.nom.toLowerCase() === it.nom.toLowerCase());
      it.action = lie ? "deja" : memeNom ? "associer" : "nouveau";
      it.chantierId = memeNom ? memeNom.id : null;
      const caseCoche = h("input", { type: "checkbox", checked: it.action !== "deja" && it.choisi !== false, disabled: it.action === "deja",
        onchange: (e) => { it.choisi = e.target.checked; majBouton(); } });
      it.choisi = caseCoche.checked;
      return h("label", { class: "case", style: { marginBottom: "8px", alignItems: "flex-start" } }, caseCoche,
        h("span", null, h("span", { class: "gras" }, it.qboNom), " ",
          it.action === "deja" ? h("span", { class: "badge neutre" }, "Déjà là")
            : it.action === "associer" ? h("span", { class: "badge qbo" }, "Associer au chantier existant") : null));
    });
    zone.replaceChildren(
      items.length ? h("p", { class: "muet petit" }, `${items.length} client${items.length > 1 ? "s" : ""}/projet${items.length > 1 ? "s" : ""} trouvé${items.length > 1 ? "s" : ""}. Coche ceux qui sont des chantiers.`)
        : h("div", { class: "alerte jaune" }, "Aucun nom trouvé dans ce fichier. Vérifie que c’est bien la liste des clients exportée de QuickBooks."),
      items.length ? h("div", { class: "ligne-flex", style: { marginBottom: "8px" } },
        h("button", { class: "btn lien", type: "button", onclick: () => { items.forEach((i) => { if (i.action !== "deja") i.choisi = true; }); afficher(); } }, "Tout cocher"),
        h("button", { class: "btn lien", type: "button", onclick: () => { items.forEach((i) => { i.choisi = false; }); afficher(); } }, "Tout décocher")) : null,
      h("div", { style: { maxHeight: "45vh", overflowY: "auto" } }, cases));
    majBouton();
  };
  const majBouton = () => {
    const n = items.filter((i) => i.choisi && i.action !== "deja").length;
    boutonImporter.disabled = n === 0;
    boutonImporter.textContent = n ? `Importer (${n})` : "Importer";
  };

  fichier.addEventListener("change", async () => {
    const f = fichier.files[0];
    if (!f) return;
    try {
      const classeur = XLSX.read(await f.arrayBuffer(), { type: "array" });
      const feuille = classeur.Sheets[classeur.SheetNames[0]];
      items = lireListeQuickBooks(XLSX.utils.sheet_to_json(feuille, { header: 1, defval: "" }));
      afficher();
    } catch (err) { erreur(new Error("Impossible de lire ce fichier.")); }
  });

  ouvrirModal((fermer) => {
    boutonImporter.addEventListener("click", () => avecAttente(boutonImporter, async () => {
      const choisis = items.filter((i) => i.choisi && i.action !== "deja");
      try {
        const nouveaux = choisis.filter((i) => i.action === "nouveau")
          .map((i) => ({ nom: i.nom, client: i.client !== i.nom ? i.client : null, qbo_nom: i.qboNom, qbo_customer_id: i.qboId || null, facturable: true, actif: true }));
        if (nouveaux.length) await q(sb.from("chantiers").insert(nouveaux));
        for (const i of choisis.filter((x) => x.action === "associer")) {
          await q(sb.from("chantiers").update(i.qboId ? { qbo_nom: i.qboNom, qbo_customer_id: i.qboId } : { qbo_nom: i.qboNom }).eq("id", i.chantierId));
        }
        fermer(); toast(`${choisis.length} chantier${choisis.length > 1 ? "s" : ""} importé${choisis.length > 1 ? "s" : ""}.`); await rechargerEtRendre();
      } catch (err) { erreur(err); }
    }));
    return {
      titre: "Importer de QuickBooks",
      contenu: qboConnecte() ? h("div", null,
        h("button", { class: "btn primaire plein", style: { marginBottom: "12px" }, onclick: (ev) => avecAttente(ev.currentTarget, async () => {
          try {
            const L = await listesQbo(true);
            items = L.clients.map((x) => { const parties = x.nom.split(":").map((t) => t.trim()).filter(Boolean);
              return { qboId: x.id, qboNom: x.nom, nom: parties[parties.length - 1], client: parties[0], choisi: x.projet || parties.length > 1 ? undefined : false }; });
            afficher();
          } catch (err) { erreur(err); }
        }) }, "Charger la liste de QuickBooks"),
        h("p", { class: "muet petit" }, "Les projets (Client:Projet) sont cochés d’avance. Coche aussi les clients qui sont eux-mêmes un chantier."),
        zone) : h("div", null,
        h("div", { class: "alerte info" },
          h("b", null, "Dans QuickBooks : "), "Ventes > Clients, puis l’icône Exporter vers Excel (au-dessus de la liste). Les projets apparaissent sous la forme Client:Projet."),
        h("label", { class: "champ" }, h("span", null, "Fichier exporté (.xlsx, .xls ou .csv)"), fichier),
        zone),
      actions: [h("button", { class: "btn", onclick: fermer }, "Annuler"), boutonImporter],
    };
  });
}

    h("button", { class: "btn primaire plein", style: { marginBottom: "12px" }, onclick: () => formCode() }, "+ Nouveau code"),

  ouvrirModal((fermer) => ({
    titre: nouveau ? "Ajouter un employé" : p.nom,
    contenu: h("div", null,
      h("label", { class: "champ" }, h("span", null, "Nom"), nom),
      h("label", { class: "champ" }, h("span", null, "Courriel"), courriel,
        h("div", { class: "muet petit", style: { marginTop: "4px" } }, p.user_id
          ? "Compte actif : le courriel de connexion se change dans Supabase (Authentication > Users)."
          : "Avec un courriel, l’employé peut se créer un compte et entrer ses heures lui-même.")),
      h("div", { class: "rangee" },
        h("label", { class: "champ" }, h("span", null, "Matricule Employeur D"), matricule),
        h("label", { class: "champ" }, h("span", null, "Taux horaire ($)"), taux)),
      h("label", { class: "champ" }, h("span", null, "Rôle"), role),
      nouveau ? null : h("label", { class: "case" }, actif, h("span", null, "Actif (décoche quand l’employé quitte)"))),
    actions: [
      h("button", { class: "btn", onclick: fermer }, "Annuler"),
      h("button", { class: "btn primaire", onclick: (e) => avecAttente(e.currentTarget, async () => {
        const t = taux.value.trim() ? lireNombre(taux.value) : null;
        if (t !== null && !(t >= 0)) { toast("Taux invalide.", "erreur"); return; }
        if (!nom.value.trim()) { toast("Le nom est requis.", "erreur"); return; }
        const mail = courriel.value.trim();
        if (mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { toast("Ce courriel ne semble pas valide.", "erreur"); return; }
        const donnees = { nom: nom.value.trim(), matricule: matricule.value.trim() || null, taux: t === null ? null : arrondi2(t) };
        if (!p.user_id) donnees.courriel = mail || null;
        if (!moi) { donnees.role = role.value; donnees.actif = nouveau ? true : actif.checked; }
        try {
          if (nouveau) await q(sb.from("profils").insert(donnees));
          else await q(sb.from("profils").update(donnees).eq("id", p.id));
          fermer(); toast(nouveau ? `${donnees.nom} ajouté.` : "Employé enregistré.");
          if (moi) S.moi = { ...S.moi, ...donnees };
          await rechargerEtRendre();
        } catch (err) { erreur(err); }
      }) }, nouveau ? "Ajouter" : "Enregistrer"),
    ],
  }));
}

/* ---------- Connexion QuickBooks et correspondances ---------- */
const normNom = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function trouverUnique(liste, test) { const r = liste.filter(test); return r.length === 1 ? r[0] : null; }

async function gestionQuickBooks() {
  const st = S.qboStatut;
  const connecter = (ev) => avecAttente(ev.currentTarget, async () => {
    try { const r = await appelQbo("connecter"); location.href = r.url; } catch (err) { erreur(err); }
  });
  if (!qboConnecte()) {
    return h("div", { class: "carte" },
      h("h3", { style: { marginTop: 0 } }, "Connecter QuickBooks"),
      h("p", { class: "muet" }, "Une fois connectée, l’app envoie les heures approuvées directement dans QuickBooks Online (activités de temps, sur le bon client, avec le code de coût et la description). Plus besoin de les retaper."),
      h("p", { class: "muet petit" }, "Tu seras envoyé sur la page d’Intuit : connecte-toi à QuickBooks, choisis la compagnie Baume Réno et accepte. Tu reviens ensuite ici automatiquement."),
      h("button", { class: "btn primaire plein", onclick: connecter }, "Connecter QuickBooks"));
  }

  const entete = h("div", { class: "carte" },
    h("div", { class: "ligne-flex", style: { alignItems: "center" } },
      h("div", { style: { flex: 1, minWidth: 0 } },
        h("div", { class: "gras" }, "Connecté à ", st.entreprise || "QuickBooks"),
        h("div", { class: "muet petit" }, `Depuis le ${String(st.connecte_le || "").slice(0, 10)}${st.connecte_par ? ` par ${st.connecte_par}` : ""}${st.environnement === "sandbox" ? " · compagnie de test" : ""}`)),
      h("span", { class: "badge approuve" }, "Connecté")),
    h("div", { class: "ligne-flex", style: { marginTop: "12px" } },
      h("button", { class: "btn", style: { flex: 1 }, onclick: (ev) => avecAttente(ev.currentTarget, async () => {
        try { await listesQbo(true); toast("Listes QuickBooks à jour."); rendre(); } catch (err) { erreur(err); }
      }) }, "Actualiser les listes"),
      h("button", { class: "btn", style: { flex: 1 }, onclick: async () => {
        if (!await confirmer("Déconnecter QuickBooks ?", "L’app n’enverra plus rien dans QuickBooks tant que tu ne la reconnectes pas. Les heures déjà envoyées restent dans QuickBooks.", "Déconnecter", true)) return;
        try { await appelQbo("deconnecter"); S.qboListes = null; toast("QuickBooks déconnecté."); await rechargerEtRendre(); } catch (err) { erreur(err); }
      } }, "Déconnecter")));

  let L;
  try { L = await listesQbo(); }
  catch (err) {
    return h("div", null, entete, h("div", { class: "alerte rouge" }, messageErreur(err), " ",
      /Reconnecte/i.test(err.message) ? h("button", { class: "btn lien", onclick: connecter }, "Reconnecter") : null));
  }

  const opt = (valeur, texte, choisi) => h("option", { value: valeur, selected: choisi }, texte);
  const changements = [];   // fonctions qui renvoient une mise à jour ou null

  // Facturation par défaut
  const taux = h("input", { type: "text", inputmode: "decimal", value: S.params.taux_facturation != null ? fmtNb(S.params.taux_facturation) : "" });
  const servDef = h("select", null, opt("", "— Choisir —", !S.params.qbo_item_defaut),
    L.services.map((x) => opt(x.id, x.nom, x.id === S.params.qbo_item_defaut)));
  changements.push(() => {
    const t = taux.value.trim() ? arrondi2(lireNombre(taux.value)) : null;
    const it = servDef.value || null;
    if (t === (S.params.taux_facturation != null ? Number(S.params.taux_facturation) : null) && it === (S.params.qbo_item_defaut || null)) return null;
    if (t !== null && !(t >= 0)) throw new Error("Taux de facturation invalide.");
    return () => q(sb.from("parametres").update({ taux_facturation: t, qbo_item_defaut: it,
      qbo_item_defaut_nom: it ? (L.services.find((x) => x.id === it) || {}).nom : null }).eq("id", 1));
  });

  // Chantiers → clients/projets
  const chantiers = S.chantiers.filter((c) => c.actif).sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
  const selChantier = new Map();
  const lignesChantiers = chantiers.map((c) => {
    const sel = h("select", null, opt("", "— Non associé —", !c.qbo_customer_id),
      L.clients.map((x) => opt(x.id, x.nom + (x.projet ? " (projet)" : ""), x.id === c.qbo_customer_id)));
    selChantier.set(c.id, sel);
    changements.push(() => {
      const v = sel.value || null;
      if (v === (c.qbo_customer_id || null)) return null;
      const cl = L.clients.find((x) => x.id === v);
      return () => q(sb.from("chantiers").update({ qbo_customer_id: v, qbo_nom: cl ? cl.nom : null }).eq("id", c.id));
    });
    return h("label", { class: "champ" }, h("span", null, c.nom), sel);
  });

  // Employés → employé ou fournisseur (sous-traitant)
  const gens = [...L.employes, ...L.fournisseurs];
  const employes = [...S.profils.values()].filter((p) => p.actif && p.role !== "comptable").sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
  const selEmploye = new Map();
  const lignesEmployes = employes.map((p) => {
    const actuel = p.qbo_employee_id ? `${p.qbo_type || "Employee"}:${p.qbo_employee_id}` : "";
    const sel = h("select", null, opt("", "— Non associé —", !actuel),
      L.employes.length ? h("optgroup", { label: "Employés" }, L.employes.map((x) => opt(`Employee:${x.id}`, x.nom, `Employee:${x.id}` === actuel))) : null,
      L.fournisseurs.length ? h("optgroup", { label: "Fournisseurs (sous-traitants)" }, L.fournisseurs.map((x) => opt(`Vendor:${x.id}`, x.nom, `Vendor:${x.id}` === actuel))) : null);
    selEmploye.set(p.id, sel);
    changements.push(() => {
      if (sel.value === actuel) return null;
      const [type, id] = sel.value ? sel.value.split(":") : [null, null];
      return () => q(sb.from("profils").update({ qbo_employee_id: id, qbo_type: type }).eq("id", p.id));
    });
    return h("label", { class: "champ" }, h("span", null, p.nom), sel);
  });

  // Codes de coût → service + taux propre (facultatif)
  const codes = S.codes.filter((c) => c.actif);
  const selCode = new Map();
  const lignesCodes = codes.map((c) => {
    const sel = h("select", { style: { flex: 2 } }, opt("", "Service par défaut", !c.qbo_item_id), L.services.map((x) => opt(x.id, x.nom, x.id === c.qbo_item_id)));
    const tx = h("input", { type: "text", inputmode: "decimal", placeholder: "Taux défaut", style: { flex: 1 }, value: c.taux_facturation != null ? fmtNb(c.taux_facturation) : "" });
    selCode.set(c.code, sel);
    changements.push(() => {
      const v = sel.value || null;
      const t = tx.value.trim() ? arrondi2(lireNombre(tx.value)) : null;
      if (v === (c.qbo_item_id || null) && t === (c.taux_facturation != null ? Number(c.taux_facturation) : null)) return null;
      if (t !== null && !(t >= 0)) throw new Error(`Taux invalide pour le code ${c.code}.`);
      return () => q(sb.from("codes_cout").update({ qbo_item_id: v, taux_facturation: t }).eq("code", c.code));
    });
    return h("div", { class: "champ" }, h("span", { class: "petit" }, h("b", null, c.code), " ", c.libelle),
      h("div", { class: "ligne-flex" }, sel, tx));
  });
  const nbCodesPerso = codes.filter((c) => c.qbo_item_id || c.taux_facturation != null).length;

  const associerAuto = () => {
    let n = 0;
    for (const c of chantiers) {
      const sel = selChantier.get(c.id); if (sel.value) continue;
      const m = trouverUnique(L.clients, (x) => normNom(x.nom) === normNom(c.qbo_nom))
        || trouverUnique(L.clients, (x) => normNom(x.affichage) === normNom(c.nom) || normNom(x.nom.split(":").pop()) === normNom(c.nom))
        || trouverUnique(L.clients, (x) => normNom(x.nom).includes(normNom(c.nom)));
      if (m) { sel.value = m.id; n++; }
    }
    for (const p of employes) {
      const sel = selEmploye.get(p.id); if (sel.value) continue;
      const nn = normNom(p.nom);
      const m = trouverUnique(gens, (x) => normNom(x.nom) === nn) || trouverUnique(gens, (x) => normNom(x.nom).split(" ").includes(nn));
      if (m) { sel.value = `${m.type}:${m.id}`; n++; }
    }
    for (const c of codes) {
      const sel = selCode.get(c.code); if (sel.value) continue;
      const m = trouverUnique(L.services, (x) => normNom(x.nom).includes(normNom(c.code)));
      if (m) { sel.value = m.id; n++; }
    }
    toast(n ? `${n} correspondance${n > 1 ? "s" : ""} trouvée${n > 1 ? "s" : ""}. Vérifie puis enregistre.` : "Rien de plus à associer automatiquement.");
  };

  const enregistrer = (ev) => avecAttente(ev.currentTarget, async () => {
    try {
      const maj = changements.map((f) => f()).filter(Boolean);
      if (!maj.length) { toast("Aucun changement."); return; }
      for (const f of maj) await f();
      toast(`${maj.length} changement${maj.length > 1 ? "s" : ""} enregistré${maj.length > 1 ? "s" : ""}.`);
      await rechargerEtRendre();
    } catch (err) { erreur(err); }
  });

  const manqueEmp = employes.filter((p) => !p.qbo_employee_id).length;
  const manqueCh = chantiers.filter((c) => !c.qbo_customer_id).length;
  return h("div", null,
    entete,
    manqueEmp || manqueCh || !S.params.qbo_item_defaut ? h("div", { class: "alerte jaune" },
      "À faire avant d’envoyer : ", [
        !S.params.qbo_item_defaut ? "choisir le service par défaut" : null,
        manqueCh ? `associer ${manqueCh} chantier${manqueCh > 1 ? "s" : ""}` : null,
        manqueEmp ? `associer ${manqueEmp} employé${manqueEmp > 1 ? "s" : ""}` : null].filter(Boolean).join(", "), ".") : null,
    h("button", { class: "btn plein", style: { marginBottom: "12px" }, onclick: associerAuto }, "Associer automatiquement par nom"),
    h("div", { class: "section-titre" }, "Facturation"),
    h("div", { class: "carte" },
      h("label", { class: "champ" }, h("span", null, "Service QuickBooks par défaut (main-d’œuvre)"), servDef,
        h("div", { class: "muet petit", style: { marginTop: "4px" } }, "Utilisé pour toutes les heures, sauf les codes qui ont leur propre service plus bas.")),
      h("label", { class: "champ" }, h("span", null, "Taux de facturation par défaut ($/h)"), taux)),
    h("div", { class: "section-titre" }, "Chantiers → clients/projets QuickBooks"),
    h("div", { class: "carte" }, lignesChantiers.length ? lignesChantiers : h("div", { class: "vide" }, "Aucun chantier actif.")),
    h("div", { class: "section-titre" }, "Employés → QuickBooks"),
    h("div", { class: "carte" }, lignesEmployes,
      h("div", { class: "muet petit" }, "Un employé doit exister dans QuickBooks (Paie › Employés) ou comme fournisseur s’il est sous-traitant.")),
    h("details", { class: "carte", open: nbCodesPerso > 0 },
      h("summary", { class: "gras", style: { cursor: "pointer" } }, `Codes de coût : service et taux propres (facultatif${nbCodesPerso ? `, ${nbCodesPerso} réglé${nbCodesPerso > 1 ? "s" : ""}` : ""})`),
      h("p", { class: "muet petit" }, "Laisse vide pour utiliser le service et le taux par défaut. Ex. : aménagement paysager à 70 $/h."),
      lignesCodes),
    h("button", { class: "btn primaire plein", style: { marginTop: "12px" }, onclick: enregistrer }, "Enregistrer les correspondances"));
}

function gestionParametres() {
  const nomEnt = h("input", { type: "text", value: S.params.nom_entreprise || "" });
  const noCie = h("input", { type: "text", value: S.params.no_compagnie || "" });
  const code = h("input", { type: "text", value: S.params.code_gain || "" });
  return h("div", { class: "carte" },
    h("label", { class: "champ" }, h("span", null, "Nom de l’entreprise (affiché en haut de l’app)"), nomEnt),
    h("label", { class: "champ" }, h("span", null, "Employeur D — numéro de compagnie"), noCie,
      h("div", { class: "muet petit", style: { marginTop: "4px" } }, "Paie > Paramètres de compagnie > Identification")),
    h("label", { class: "champ" }, h("span", null, "Employeur D — code de gain (heures régulières)"), code,
      h("div", { class: "muet petit", style: { marginTop: "4px" } }, "Voir le « Canevas d’importation – Transaction de paie » dans l’aide d’Employeur D")),
    h("button", { class: "btn primaire plein", onclick: (e) => avecAttente(e.currentTarget, async () => {
      try {
        await q(sb.from("parametres").update({ nom_entreprise: nomEnt.value.trim(), no_compagnie: noCie.value.trim(), code_gain: code.value.trim(), updated_at: new Date().toISOString() }).eq("id", 1));
        toast("Paramètres enregistrés."); await rechargerEtRendre();
      } catch (err) { erreur(err); }
    }) }, "Enregistrer"));
}

const VUES = { heures: vueMesHeures, calendrier: vueCalendrier, approbation: vueApprobation, rapports: vueRapports, paie: vueExports, gestion: vueGestion };

/* =====================================================================
   Démarrage
   ===================================================================== */
async function surSession(session) {
  const etaitConnecte = S.session && S.session.user.id;
  S.session = session;
  if (!session) { S.moi = null; S.profils = new Map(); rendre(); return; }
  if (etaitConnecte === session.user.id && S.moi) return; // simple renouvellement du jeton
  try {
    const moi = await q(sb.from("profils").select("*").eq("user_id", session.user.id).maybeSingle());
    if (!moi || !moi.actif) {
      await sb.auth.signOut();
      toast(moi ? "Ce compte est désactivé." : "Profil introuvable. Avise le bureau.", "erreur");
      return;
    }
    S.moi = moi;
    if (moi.role === "comptable" && !["calendrier", "rapports", "paie"].includes(S.vue)) S.vue = "calendrier";
    document.querySelectorAll(".toast").forEach((t) => t.remove());
    await chargerReferences();
    await compterEnAttente();
    if (S.retourQbo) { const [m, t] = S.retourQbo; S.retourQbo = null; setTimeout(() => toast(m, t), 300); }
  } catch (e) { erreur(e); }
  rendre();
}

(function demarrer() {
  if (!configOK) { rendre(); return; }
  if (!sb) { $("#app").replaceChildren(h("div", { class: "connexion" }, h("h1", null, "Hors ligne"), h("p", { class: "muet" }, "Impossible de charger l’app. Vérifie ta connexion Internet puis recharge la page."))); return; }
  const typeLien = new URLSearchParams(location.hash.slice(1)).get("type");
  const retourQbo = new URLSearchParams(location.search);
  if (retourQbo.has("qbo")) {
    const etat = retourQbo.get("qbo"), msg = retourQbo.get("message");
    history.replaceState(null, "", location.pathname + location.hash);
    S.vue = "gestion"; S.gestion = "quickbooks";
    S.retourQbo = etat === "ok" ? ["QuickBooks est connecté !"] : etat === "annule" ? ["Connexion QuickBooks annulée.", "erreur"]
      : [msg || "La connexion à QuickBooks a échoué.", "erreur"];
  }
  if (typeLien === "invite" || typeLien === "recovery") S.aChoisirMdp = true;
  sb.auth.onAuthStateChange((evenement, session) => {
    if (evenement === "PASSWORD_RECOVERY") S.aChoisirMdp = true;
    // différé : éviter d'appeler Supabase à l'intérieur du rappel (blocage connu)
    setTimeout(() => surSession(session), 0);
  });
  // rafraîchit en revenant dans l'app (ex. téléphone sorti de la poche)
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && S.moi && !document.querySelector(".modal-fond")) {
      try { await compterEnAttente(); } catch (e) { /* hors ligne */ }
      rendre();
    }
  });
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
